<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conti di casa</title>
<style>
:root{color-scheme:light;--bg:#e8f1fb;--head:#dbe9f8;--card:#fff;--ink:#16293f;--muted:#586f8c;--line:#cfe0f2;--accent:#2b7de9;--accent-ink:#fff;--good:#137a55;--bad:#cc3d4a;--warn:#a86800;--soft:#e0edf9;--shadow:0 1px 2px rgba(35,90,160,.08)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--head);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px 4px;max-width:1080px;margin:0 auto}
h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px 16px 8px;max-width:1080px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;font:inherit;font-weight:550;cursor:pointer}
nav button.on{background:var(--accent);color:#fff}
nav button:not(.on):hover{background:rgba(43,125,233,.1)}
main{max-width:1080px;margin:0 auto;padding:16px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 10px;font-weight:650}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:22px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px;min-height:16px}
.two{grid-template-columns:1fr;}
@media(min-width:860px){.two{grid-template-columns:1fr 1fr}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.grow{flex:1}
.mnav{display:flex;gap:4px;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label>input,label>select{display:block;width:100%;margin-top:4px;color:var(--ink)}
label.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
label.chk input{width:auto;margin:0;flex:none}
.btn{font:inherit;font-weight:550;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:13px}
.muted{color:var(--muted)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.bars .r{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.bars .track{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bars .fill{height:100%;border-radius:99px}
.bars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.tx:last-child{border-bottom:0}
.txd{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.txs{font-size:12px;color:var(--muted)}
.txa{font-weight:600;text-align:right}
.txc{grid-column:1/-1;display:flex;gap:6px;align-items:center}
.txc select{flex:1;min-width:0;padding:4px 8px;font-size:13px}
@media(min-width:760px){.tx{grid-template-columns:1fr 110px 270px}.txc{grid-column:auto}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.pos{padding:12px 0;border-bottom:1px solid var(--line)}
.pos:last-child{border-bottom:0}
.pos .ph{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;align-items:baseline}
.pos .pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px 12px;margin-top:8px}
.pos .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pos .v{font-variant-numeric:tabular-nums;font-weight:550}
.pos input{width:100%;max-width:120px}
.bf{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.bf:last-child{border-bottom:0}
.bf .bi{grid-column:1/-1;min-width:0}
.bf .bt{word-break:break-word}
@media(min-width:700px){.bf{grid-template-columns:1fr auto auto}.bf .bi{grid-column:auto}}
.right{text-align:right}
.acc{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.acc .card{margin:0;display:flex;flex-direction:column;gap:6px}
.acc .big{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
.acc .btns{display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);overflow:auto}
dialog::backdrop{background:rgba(22,60,110,.35)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}
.mh h2{margin:0;font-size:17px}
.mb{padding:12px 16px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:92vw}
#toast.on{opacity:1}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.mvt th{white-space:nowrap}
.sortb{font:inherit;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:none;border:0;padding:2px 0;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.sortb:hover{color:var(--ink)}
.sortb.on{color:var(--accent)}
.sortb .ar{font-size:10px;opacity:.75}
.mvt td.c-d{white-space:nowrap;color:var(--ink);font-weight:500}
.mvt td.c-s{min-width:200px;max-width:440px}
.mvt td.c-a{white-space:nowrap}
.mvt td.c-c select{width:100%;max-width:210px;padding:4px 8px;font-size:13px}
.mvt td.c-m{white-space:nowrap;font-weight:600}
.mvt td.c-x{white-space:nowrap;text-align:right}
.mvt .c-chk{width:30px}
.mvt tr.sel{background:color-mix(in srgb,var(--accent) 9%,transparent)}
#mvBar{position:sticky;top:var(--hh,92px);z-index:4}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--head);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 10px;box-shadow:var(--shadow)}
.bulk select{max-width:210px;padding:4px 8px;font-size:13px}
.mobonly{display:none}
.mvsort{display:none}
.mvsel{display:none;margin:2px 0 8px}
.alr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.alr input{width:130px;text-align:right}
.cmr{display:grid;gap:4px 12px;padding:7px 0;border-bottom:1px solid var(--line)}
.cmr:last-child{border-bottom:0}
.cmr select{width:100%;min-width:0}
@media(min-width:560px){.cmr{grid-template-columns:1fr 1fr;align-items:center}}
@media(max-width:759px){
  .mvt thead{display:none}
  .mvt,.mvt tbody{display:block}
  .mvt tr{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"chk d m" "chk s s" "chk c x";gap:3px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
  .mvt td{display:block;padding:0;border:0;min-width:0}
  .mvt td.c-chk{grid-area:chk;width:auto}
  .mvt td.c-d{grid-area:d}
  .mvt td.c-s{grid-area:s;min-width:0;max-width:none}
  .mvt td.c-a{display:none}
  .mvt td.c-c{grid-area:c}
  .mvt td.c-c select{max-width:none}
  .mvt td.c-m{grid-area:m;text-align:right}
  .mvt td.c-x{grid-area:x}
  .mobonly{display:inline}
  .mvsort{display:block}
  .mvsel{display:flex}
}
/* patrimonio */
.pk{grid-template-columns:repeat(3,1fr)}
.pk .hero{grid-column:1/-1}
.pk .hero .val{font-size:30px}
.pgh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.prow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.prow>div:first-child{min-width:0;overflow-wrap:anywhere}
.pv{text-align:right;flex:none}
.psm{font-size:12px}
.sbar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--soft);margin:6px 0 10px}
.sbar i{display:block;height:100%}
.lg{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14px}
.lg .nm{flex:1;min-width:0}
.lg .lgp{width:38px;text-align:right}
@media(max-width:520px){.pk{grid-template-columns:repeat(2,1fr)}.pk .val{font-size:19px}.pk .hero .val{font-size:28px}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Conti di casa</h1><span class="grow"></span><span class="muted" style="font-size:12px">dati salvati solo su questo dispositivo</span></div>
  <nav>
    <button data-act="tab" data-tab="pat">Patrimonio</button>
    <button data-act="tab" data-tab="home">Panoramica</button>
    <button data-act="tab" data-tab="mov">Movimenti</button>
    <button data-act="tab" data-tab="bol">Bollette</button>
    <button data-act="tab" data-tab="rec">Ricorrenti</button>
    <button data-act="tab" data-tab="acc">Conti</button>
    <button data-act="tab" data-tab="inv">Investimenti</button>
    <button data-act="tab" data-tab="set">Impostazioni</button>
  </nav>
</header>
<main id="view"></main>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<input type="file" id="jsonFile" accept=".json,application/json" hidden>
<input type="file" id="secFile" accept=".xls,.xlsx,.csv,.txt" hidden>
<input type="file" id="bfpFile" accept=".xlsx,.xls" hidden>

<script>
// ==CORE==
// Funzioni pure (testabili in Node): parsing, dedup, regole, giroconti, saldo.
function cyrb53(str, seed){
  seed=seed||0;
  var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;
  for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
function normDesc(s){
  return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
}
function parseAmount(v){
  if(typeof v==='number') return isFinite(v)?v:null;
  if(v==null) return null;
  var s=String(v).trim();
  if(!s) return null;
  var neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  s=s.replace(/EUR/gi,'').replace(/[€\s\u00a0]/g,'');
  if(s.charAt(s.length-1)==='-'){neg=true;s=s.slice(0,-1);}
  if(s.charAt(0)==='-'){neg=true;s=s.slice(1);}
  else if(s.charAt(0)==='+'){s=s.slice(1);}
  if(!/^[\d.,]+$/.test(s)) return null;
  var hasDot=s.indexOf('.')>=0,hasCom=s.indexOf(',')>=0;
  if(hasDot&&hasCom){
    if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  }else if(hasCom){
    s=s.replace(/\./g,'');
    if((s.match(/,/g)||[]).length>1) s=s.replace(/,/g,''); else s=s.replace(',','.');
  }else if(hasDot){
    if((s.match(/\./g)||[]).length>1||/^\d{1,3}\.\d{3}$/.test(s)) s=s.replace(/\./g,'');
  }
  var x=parseFloat(s);
  if(isNaN(x)) return null;
  return neg?-x:x;
}
function pad2(n){return (n<10?'0':'')+n;}
function parseDate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date){
    if(isNaN(v.getTime())) return null;
    var d0=new Date(v.getTime()+12*3600*1000);
    return d0.getUTCFullYear()+'-'+pad2(d0.getUTCMonth()+1)+'-'+pad2(d0.getUTCDate());
  }
  if(typeof v==='number'){
    if(v>20000&&v<80000){
      var d1=new Date(Math.round((v-25569)*86400000));
      return d1.getUTCFullYear()+'-'+pad2(d1.getUTCMonth()+1)+'-'+pad2(d1.getUTCDate());
    }
    return null;
  }
  var s=String(v).trim(),m;
  if((m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/))){
    var y=+m[1],mo=+m[2],d=+m[3];
    if(mo>=1&&mo<=12&&d>=1&&d<=31) return y+'-'+pad2(mo)+'-'+pad2(d);
    return null;
  }
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){
    var d2=+m[1],mo2=+m[2],y2=+m[3];
    if(y2<100) y2+=2000;
    if(mo2>=1&&mo2<=12&&d2>=1&&d2<=31) return y2+'-'+pad2(mo2)+'-'+pad2(d2);
    return null;
  }
  return null;
}
function parseCSV(text,delim){
  text=text.replace(/^\uFEFF/,'');
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===delim){row.push(cur);cur='';}
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur);cur='';rows.push(row);row=[]; }
      else cur+=c;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});
}
function detectDelimiter(text){
  var lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(function(l){return l.trim();}).slice(0,60);
  var best=';',bestScore=-1,cands=[';','\t',',','|'];
  cands.forEach(function(d){
    var counts=lines.map(function(l){return l.split(d).length-1;}).filter(function(n){return n>0;});
    if(!counts.length) return;
    var freq={};counts.forEach(function(n){freq[n]=(freq[n]||0)+1;});
    var mode=0,mf=0;
    for(var k in freq){ if(freq[k]>mf||(freq[k]===mf&&+k>mode)){mf=freq[k];mode=+k;} }
    var score=mf*mode;
    if(score>bestScore){bestScore=score;best=d;}
  });
  return best;
}
function findHeaderRow(rows){
  var lim=Math.min(rows.length,40);
  for(var i=0;i<lim;i++){
    var cells=(rows[i]||[]).map(function(x){return String(x==null?'':x).toLowerCase().replace(/[_\-.]+/g,' ').trim();}).filter(function(x){return x&&x.length<=40;});
    var hasDate=cells.some(function(x){return /\bdata\b|\bdate\b/.test(x);});
    var hasAmt=cells.some(function(x){return /importo|amount|\bdare\b|\bavere\b|entrat|uscit|addebit|accredit/.test(x);});
    if(hasDate&&hasAmt) return i;
  }
  return -1;
}
function guessMapping(h){
  var low=h.map(function(x){return String(x==null?'':x).toLowerCase().replace(/_+/g,' ').replace(/\s+/g,' ').trim();});
  function find(re){for(var i=0;i<low.length;i++) if(re.test(low[i])) return i; return -1;}
  var date=find(/data.*(contabil|operaz)|^data$|^date$/);
  if(date<0) date=find(/data|date/);
  var amount=find(/^importo|^amount|^valore/);
  var inCol=-1,outCol=-1;
  if(amount<0){inCol=find(/entrat|avere|accredit/);outCol=find(/uscit|dare|addebit/);}
  var cat=find(/cluster ?2|sottocateg/);
  if(cat<0) cat=find(/^categori|^cluster|^etichett|^tag$/);
  var cy=-1,cm=-1,comp=-1;
  low.forEach(function(x,i){
    if(i>date&&/^anno( di competenza)?$/.test(x)) cy=i;
    if(i>date&&/^mese( di competenza)?$/.test(x)) cm=i;
  });
  if(cy<0||cm<0){cy=-1;cm=-1;comp=find(/competenza/);}
  var descs=[];
  low.forEach(function(x,i){
    if(i===date||i===amount||i===inCol||i===outCol||i===cat||i===cy||i===cm||i===comp) return;
    if(/data/.test(x)) return;
    if(/descri|causale|dettagl|motivo|beneficiar|controparte|note|operazione|riferiment|parola chiave|movimento|osservaz|concetto/.test(x)) descs.push(i);
  });
  if(!descs.length){
    for(var j=0;j<low.length;j++){ if(j!==date&&j!==amount&&j!==inCol&&j!==outCol&&j!==cat&&j!==cy&&j!==cm&&j!==comp&&!/saldo|valuta|data/.test(low[j])&&low[j]){descs.push(j);break;} }
  }
  return {date:date,amount:amount,inCol:inCol,outCol:outCol,descs:descs,cat:cat,cy:cy,cm:cm,comp:comp};
}
function parseRows(rows,hdr,map,invert){
  var items=[],skipped=0;
  for(var i=hdr+1;i<rows.length;i++){
    var r=rows[i]||[];
    var d=map.date>=0?parseDate(r[map.date]):null;
    var amt=null;
    if(map.amount>=0) amt=parseAmount(r[map.amount]);
    else{
      var a=map.inCol>=0?parseAmount(r[map.inCol]):null,b=map.outCol>=0?parseAmount(r[map.outCol]):null;
      if(a!=null||b!=null) amt=Math.abs(a||0)-Math.abs(b||0);
    }
    if(!d||amt==null){skipped++;continue;}
    if(invert) amt=-amt;
    var parts=[];
    map.descs.forEach(function(c){
      var v=String(r[c]==null?'':r[c]).replace(/\s+/g,' ').trim();
      if(v&&parts.indexOf(v)<0) parts.push(v);
    });
    var it={d:d,cents:Math.round(amt*100),amt:amt,s:parts.join(' \u00b7 ')};
    if(map.cat>=0){
      var cv=String(r[map.cat]==null?'':r[map.cat]).replace(/\s+/g,' ').trim();
      if(cv){it.cl=cv;if(!it.s) it.s='Voce manuale \u00b7 '+cv;}
    }
    var ym=null;
    if(map.cy>=0&&map.cm>=0){var yy=parseInt(r[map.cy],10),mm=monthNum(r[map.cm]);if(yy>1990&&yy<2100&&mm) ym=yy+'-'+pad2(mm);}
    else if(map.comp>=0) ym=parseYM(r[map.comp]);
    if(ym) it.ym=ym;

        if(!a.cred){a.cred='S';ch=true;}
      }
      if(a.id==='bbva'){
        if(!a.cred){a.cred='M1';ch=true;}
        if(a.mode==='saldo'&&!(s.snaps||[]).some(function(x){return x.a==='bbva';})){a.mode='mov';ch=true;}
      }
      if(ch&&a.id==='libretto'||ch&&a.id==='bbva') a.u=Date.now();
    });
    s.v=4;
  }
  if(!s.sec) s.sec=[];
  if(!s.bfp) s.bfp=[];
  if(!s.bfpH) s.bfpH=[];
  if(!s.imps) s.imps=[];
  if(!s.pat) s.pat=[];
  if(!s.pats) s.pats=[];
  if(!s.px) s.px={};
  if(!s.people) s.people=[];
  if(!s.del) s.del={};
  return s;
}

function autoCat(t,comp){
  var giro=giroId(),risp=rispId();
  var o=ownTransferCat(t.s,t.a,t.m,S.accounts,giro,risp);
  if(o) return o;
  var acc=acctById(t.a);
  if(acc&&acc.inv&&t.m>0&&giro&&inflowFromHousehold(t.s,S.people)) return giro;
  var c=categorize(t.s,comp);
  if(c&&c===risp&&acc&&acc.inv&&t.m>0) c=giro;
  return c;
}
function applyOwnTransfers(){
  var giro=giroId(),risp=rispId(),n=0;
  S.tx.forEach(function(t){
    if(t.c&&t.c!==giro&&t.c!==risp) return;
    var o=ownTransferCat(t.s,t.a,t.m,S.accounts,giro,risp);
    if(o&&o!==t.c){t.c=o;stamp(t);n++;}
  });
  return n;
}

function withSel(html,v){return v?html.replace('value="'+esc(v)+'"','value="'+esc(v)+'" selected'):html;}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},3200);}
function effType(t){var c=catById(t.c);return c?c.t:(t.m<0?'spesa':'entrata');}
function aggregate(txs){
  var r={entrate:0,uscite:0,risp:0,byCat:{},n:txs.length};
  txs.forEach(function(t){
    var c=catById(t.c),ty=c?c.t:(t.m<0?'spesa':'entrata');
    if(ty==='spesa'){r.uscite+=-t.m;var k=c?c.id:'_none';r.byCat[k]=(r.byCat[k]||0)+(-t.m);}
    else if(ty==='entrata') r.entrate+=t.m;
    else if(ty==='risparmio') r.risp+=-t.m;
  });
  return r;
}
// f.month filtra per competenza (le spese ripartite compaiono come «quote» virtuali); f.cash = per data di valuta bancaria
function txFor(f){
  var qq=f.q?normDesc(f.q):'',out=[];
  S.tx.forEach(function(t){
    if(f.acct&&f.acct!=='all'&&t.a!==f.acct) return;
    if(f.cat&&(f.cat==='_none'?t.c:t.c!==f.cat)) return;
    if(f.batch&&t.b!==f.batch) return;
    if(qq&&normDesc(t.s).indexOf(qq)<0) return;
    if(!f.month){out.push(t);return;}
    if(f.cash||!t.al){if(t.d.indexOf(f.month)===0) out.push(t);return;}
    txParts(t).forEach(function(p){if(p.ym===f.month) out.push(Object.assign({},t,{m:p.m,_p:p.ym,_tot:t.m}));});
  });
  return out;
}
function snapsOf(id){return S.snaps.filter(function(s){return s.a===id;}).sort(function(a,b){return b.d.localeCompare(a.d)||(b.u||0)-(a.u||0);});}
function recPaid(r,ym){
  return S.tx.some(function(t){
    return t.a===r.a&&t.d.indexOf(ym)===0&&Math.sign(t.m)===Math.sign(r.m)&&
      Math.abs(Math.abs(t.m)-Math.abs(r.m))<=Math.abs(r.m)*0.2&&(!r.kw||kwMatch(normDesc(t.s),r.kw));
  });
}
function delta(cur,prev,goodUp){
  if(!prev) return '';
  var p=(cur-prev)/Math.abs(prev)*100;
  if(Math.abs(p)<0.5) return '<span class="muted">= mese prec.</span>';
  var up=p>0,good=goodUp?up:!up;
  return '<span class="'+(good?'good':'bad')+'">'+(up?'▲':'▼')+' '+Math.abs(Math.round(p))+'% vs mese prec.</span>';
}

// ===== Grafici =====
function niceStep(x){var p=Math.pow(10,Math.floor(Math.log10(x))),r=x/p;return (r<=1?1:r<=2?2:r<=5?5:10)*p;}
function shortEur(c){var e=c/100;return e>=1000?(e/1000).toLocaleString('it-IT',{maximumFractionDigits:1})+'k':String(Math.round(e));}
function barChart(labels,series){
  var W=640,H=210,pl=42,pb=26,pt=10,pr=8;
  var max=Math.max.apply(null,[1].concat.apply([],series.map(function(s){return s.values;})));
  var step=niceStep(max/4),top=Math.ceil(max/step)*step;
  var iw=W-pl-pr,ih=H-pt-pb,n=labels.length,gw=iw/n,bw=Math.min(22,(gw*0.8)/series.length),g='';
  for(var i=0;i<=Math.round(top/step);i++){
    var y=pt+ih-(i*step/top)*ih;
    g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+shortEur(i*step)+'</text>';
  }
  labels.forEach(function(lb,i){
    var x0=pl+gw*i+gw/2-(bw*series.length)/2;
    series.forEach(function(s,j){
      var v=Math.max(0,s.values[i]),h=top?v/top*ih:0;
      g+='<rect x="'+(x0+j*bw)+'" y="'+(pt+ih-h)+'" width="'+(bw-1)+'" height="'+h+'" rx="2" fill="'+s.color+'"><title>'+esc(lb)+' · '+esc(s.name)+': '+eur(v)+'</title></rect>';
    });
    g+='<text x="'+(pl+gw*i+gw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+esc(lb)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" style="width:100%;height:auto">'+g+'</svg>';
}

function deleteTx(ids,remember){
  var set=toSet(ids),now=Date.now(),n=0;
  S.tx=S.tx.filter(function(t){if(set[t.id]){S.del[t.id]=remember?now:-now;n++;return false;}return true;});
  save();return n;
}
// sposta i movimenti su un altro conto ricalcolando gli id (così un nuovo import dello stesso file non crea doppioni)
function moveTx(ids,dest,carry){
  var set=toSet(ids),now=Date.now(),byId={},res={moved:0,dup:0,map:{}},drop={};
  S.tx.forEach(function(t){byId[t.id]=t;});
  S.tx.forEach(function(t){
    if(!set[t.id]||t.a===dest) return;
    var oid=t.id,nid=moveId(t,dest),ex=byId[nid];
    if(nid!==oid&&ex&&ex!==t){
      if(!ex.c&&t.c){ex.c=t.c;stamp(ex);}
      if(!ex.al&&t.al){ex.al=t.al;stamp(ex);}
      drop[oid]=1;S.del[oid]=now;res.dup++;res.map[oid]=ex.id;return;
    }
    if(nid!==oid){S.del[oid]=now;delete S.del[nid];delete byId[oid];t.id=nid;byId[nid]=t;}
    t.a=dest;stamp(t);res.moved++;res.map[oid]=nid;
  });
  if(res.dup) S.tx=S.tx.filter(function(t){return !drop[t.id];});
  if(carry) carryAcct(carry.from,dest,carry.spec);
  save();return res;
}
// porta IBAN / n. conto / saldo di riferimento da un conto a un altro (spec = solo ciò che era stato letto da una certa importazione)
function carryAcct(srcId,destId,spec){
  var s=acctById(srcId),d=acctById(destId);if(!s||!d||s===d) return;
  if(s.iban&&(!spec||(spec.iban&&s.iban===spec.iban))){if(!d.iban) d.iban=s.iban;if(d.iban===s.iban) s.iban='';}
  if(s.num&&(!spec||(spec.num&&s.num===spec.num))){if(!d.num) d.num=s.num;if(d.num===s.num) s.num='';}
  var sa=s.anchor;
  if(sa&&(!spec||(spec.anchor&&sa.d===spec.anchor.d&&sa.m===spec.anchor.m))){
    if(!d.anchor||sa.d>d.anchor.d) d.anchor={d:sa.d,m:sa.m};
    s.anchor=(spec&&spec.prev)?spec.prev:null;
  }
  stamp(s);stamp(d);
}
function undoBatch(id){
  var b=S.imps.find(function(x){return x.id===id;});if(!b) return 0;
  var now=Date.now(),n=0;
  S.tx=S.tx.filter(function(t){if(t.b===id){S.del[t.id]=-now;n++;return false;}return true;});
  var acc=acctById(b.a);
  if(acc){
    if(b.liban&&acc.iban===b.liban){acc.iban='';stamp(acc);}
    if(b.lnum&&acc.num===b.lnum){acc.num='';stamp(acc);}
    if(b.na&&acc.anchor&&acc.anchor.d===b.na.d&&acc.anchor.m===b.na.m){acc.anchor=b.pa||null;stamp(acc);}
  }
  removeItem('imps',id);
  return n;
}

function txModal(id){

  var v=t||{a:U.mv.acct!=='all'?U.mv.acct:accs[0].id,d:todayISO(),m:-1,s:'',c:null};

      if(c==null||c===0){toast('Importo non valido');return false;}
      var nm=Math.abs(c)*(+f.get('dir')),nd=f.get('d'),ns=f.get('s').trim(),na=f.get('a'),nc=f.get('c')||null;

        S.tx.push(stamp({id:'m'+uid(),a:na,d:nd,m:nm,s:ns,c:nc}));

      }
      var cur=t;

function impParse(){
  var r=parseRows(imp.rows,imp.hdr,imp.map,imp.invert);
  assignIds(r.items,imp.acct);
  var byId={},byDC={},used={},exist=[],fresh=[],blocked=0,mine=[];
  S.tx.forEach(function(t){
    byId[t.id]=t;
    if(t.a===imp.acct){mine.push(t);var k=t.d+'|'+t.m;(byDC[k]=byDC[k]||[]).push(t);}
  });
  r.items.forEach(function(i){
    var t=byId[i.id];
    if(t&&t.a===imp.acct&&!used[t.id]){used[t.id]=1;i._m=1;exist.push({it:i,tx:t});}
  });
  var upd=impUpdateMode();
  if(upd) r.items.forEach(function(i){

function doImport(){
  if(!imp||!imp.rows){toast('Seleziona prima un file');return false;}
  var res=impParse(),acc=acctById(imp.acct),mt=imp.meta||{},o=imp.o,now=Date.now();
  if(!acc){toast('Scegli un conto');return false;}
  if(acctMismatch(acc,mt)&&!confirm('Il file sembra di un altro conto (…'+idTail(mt)+') rispetto a «'+acc.n+'» (…'+idTail(acc)+'). Importare comunque?')) return false;
  var batch={id:'p'+uid(),a:imp.acct,f:imp.fname,at:now,n:0,k:imp.map.cat>=0?'cl':'ec'};
  if(mt.iban&&!acc.iban){acc.iban=mt.iban;stamp(acc);batch.liban=mt.iban;}
  if(mt.num&&!acc.num){acc.num=mt.num;stamp(acc);batch.lnum=mt.num;}
  S.people=S.people||[];
  if(mt.holder&&S.people.indexOf(mt.holder)<0) S.people.push(mt.holder);
  var anchored=false;
  if(mt.fin!=null&&mt.to&&(!acc.anchor||mt.to>=acc.anchor.d)&&!(acc.anchor&&acc.anchor.d===mt.to&&acc.anchor.m===Math.round(mt.fin*100))){
    batch.pa=acc.anchor?{d:acc.anchor.d,m:acc.anchor.m}:null;
    acc.anchor={d:mt.to,m:Math.round(mt.fin*100)};batch.na={d:acc.anchor.d,m:acc.anchor.m};stamp(acc);anchored=true;
  }
  // categorie del file → categorie dell'app (quelle nuove vengono create solo se servono)
  var cdo=imp.map.cat>=0&&o.cat,newCats={},made=0,lsum={};
  res.items.forEach(function(i){if(i.cl){var k=normDesc(i.cl);lsum[k]=(lsum[k]||0)+i.cents;}});
  function resolve(it,create){
    if(!cdo||!it.cl) return undefined;
    var tg=imp.cmap[catKey(it.cl,it.cents)];
    if(!tg) return undefined;
    if(tg!=='+') return catById(tg)?tg:undefined;
    var key=normDesc(it.cl),c=newCats[key]||S.cats.find(function(x){return normDesc(x.n)===key;});
    if(!c){
      if(!create) return undefined;
      var ty=lsum[key]>0?'entrata':'spesa';
      c={id:'k'+uid(),n:it.cl,t:ty,b:0,bol:ty==='spesa'&&/^bolletta\b/i.test(it.cl),col:PALETTE[S.cats.length%PALETTE.length],u:now};
      S.cats.push(c);made++;
    }
    newCats[key]=c;return c.id;
  }
  var comp0=compileRules(S.rules),added=0,upd=0;
  res.fresh.forEach(function(it){
    var t={id:it.id,a:imp.acct,d:it.d,m:it.cents,s:it.s,c:null,u:now,b:batch.id},cc=resolve(it,true);
    t.c=cc!==undefined?cc:autoCat(t,comp0);

  });
  if(impUpdateMode()) res.exist.forEach(function(e){
    var t=e.tx,ch=false,cc=resolve(e.it,true);
    if(cc!==undefined&&t.c!==cc&&(o.over||!t.c)){t.c=cc;ch=true;}
    if(o.al&&e.it.al){
      var n=normAl(e.it.al,t);
      if(n&&JSON.stringify(n)!==JSON.stringify(t.al)){t.al=n;ch=true;}
    }
    if(ch){stamp(t);upd++;}

  // regole apprese dalle categorie dell'utente (salvate solo nel browser)
  var learned=0,auto=0;
  if(cdo&&o.learn){
    var samples=[];
    res.items.forEach(function(it){var c=resolve(it,false);if(c) samples.push({s:it.s,c:c});});
    var have={};S.rules.forEach(function(r){have[normDesc(r.k)]=1;});
    learnRules(samples,{max:120,known:function(s){return categorize(s,comp0);}}).filter(function(r){return !have[r.k];}).reverse().forEach(function(r){
      S.rules.unshift({id:'r'+uid(),k:r.k,c:r.c,u:now});learned++;
    });
    if(learned){
      var comp1=compileRules(S.rules);
      S.tx.forEach(function(t){if(!t.c){var c=categorize(t.s,comp1);if(c){t.c=c;stamp(t);auto++;}}});

    return false;
  }
  if(added){batch.n=added;stamp(batch);S.imps.push(batch);}
  applyOwnTransfers();
  var pairs=runTransfers();

  return true;
}

  var acc=S.accounts.find(function(a){return r.dossier&&(a.num===r.dossier||(a.iban&&a.iban.slice(-r.dossier.length)===r.dossier));})||S.accounts.find(function(a){return a.inv;})||null;
  var key=(r.dossier||(acc&&acc.id)||'d');
  assignSecIds(r.items,key);
  var ex={};(S.sec||[]).forEach(function(x){ex[x.id]=1;});
  var fresh=r.items.filter(function(i){return !ex[i.id];});
  fresh.forEach(function(i){delete S.del[i.id];});
  var now=Date.now();
  S.sec=S.sec||[];
  fresh.forEach(function(i){S.sec.push({id:i.id,a:acc?acc.id:'',d:i.d,dv:i.dv,isin:i.isin,n:i.n,sg:i.sg,q:i.q,px:i.px,cv:i.cv,u:now});});
  if(acc&&r.dossier&&!acc.num&&!(acc.iban&&acc.iban.slice(-r.dossier.length)===r.dossier)){acc.num=r.dossier;stamp(acc);}
  S.people=S.people||[];
  if(r.holder&&S.people.indexOf(r.holder)<0) S.people.push(r.holder);

}

function interestFor(a){
  if(!a||!(a.rate>0)||!a.cred) return null;
  var T=todayISO(),base,hist;
  if(a.mode==='mov'){
    var bal=computeBalance(a,S.tx);
    if(bal==null) return null;
    var mine=S.tx.filter(function(t){return t.a===a.id;}),last=a.anchor.d;
    mine.forEach(function(t){if(t.d>last) last=t.d;});
    base={d:last,m:bal};
    hist=function(d){var b=bal;for(var i=0;i<mine.length;i++){var t=mine[i];if(t.d>d&&t.d<=last) b-=t.m;}return b;};
  }else{
    var sn=snapsOf(a.id);
    if(!sn.length) return null;
    var asc=sn.slice().reverse();
    base={d:sn[0].d,m:sn[0].m};
    hist=function(d){var v=asc[0].m;for(var i=0;i<asc.length;i++){if(asc[i].d<=d) v=asc[i].m;}return v;};
  }
  var p=projectInterest({rate:a.rate,wh:a.wh,cred:a.cred,base:base,hist:hist,T:T});
  if(p){p.baseD=base.d;p.baseM=base.m;}
  return p;
}

var PAT_G=[
  {g:'cc',n:'Conti correnti',col:'#4f8cff'},
  {g:'risp',n:'Risparmio remunerato',col:'#27ae7a'},
  {g:'inv',n:'Titoli e ETF',col:'#b86bff'},

];
var PAT_T=[['immobile','Immobile (casa, terreno…)','att'],['veicolo','Veicolo','att'],['attaltro','Altro bene','att'],['mutuo','Mutuo residuo','pas'],['finanz','Finanziamento residuo','pas'],['pasaltro','Altro debito','pas']];
function patTypeName(t){var x=PAT_T.find(function(p){return p[0]===t;});return x?x[1].replace(/ \(.*\)$/,''):'';}
// righe del patrimonio con la stessa logica di saldo della scheda Conti; i buoni postali entrano al netto dell'imposta stimata
function patRows(){
  var rows=[],miss=[],T=todayISO();
  S.accounts.forEach(function(a){
    var bal=null,ip=interestFor(a);
    if(a.mode==='mov') bal=computeBalance(a,S.tx);
    else{var l=snapsOf(a.id)[0];bal=l?l.m:null;}
    if(ip) bal=ip.est;
    if(bal==null) miss.push(a);
    else rows.push({g:a.rate>0?'risp':'cc',id:a.id,n:a.n,bank:a.bank||'',m:bal,est:!!ip});
    var dos=a.inv?dossierInfo(a.id):null;
    if(dos) rows.push({g:'inv',id:a.id,n:'Titoli · '+a.n,bank:a.bank||'',m:dos.value,cost:dos.cost,pl:dos.pl});
  });
  if(S.bfp&&S.bfp.length){
    var sm=bfpSummary(T);
    rows.push({g:'bfp',n:'Buoni fruttiferi postali',bank:'Poste Italiane',m:Math.round(sm.net),gross:Math.round(sm.val),tax:Math.round(sm.tax),cnt:sm.n});
  }
  (S.pat||[]).forEach(function(it){
    rows.push({g:it.k,id:it.id,n:it.n,bank:patTypeName(it.t),m:it.m,d:it.d,note:it.note||'',stale:patStale(it,T),man:true});
  });
  return {rows:rows,miss:miss};
}
// registra (o aggiorna) il punto di oggi nello storico; false se non c'è niente da cambiare
function patRecord(){
  var T=todayISO(),pr=patRows();
  if(!pr.rows.length) return false;
  var t=patTotals(pr.rows),id='p'+T,ex=(S.pats||[]).find(function(x){return x.id===id;});
  if(!ex&&S.del[id]) return false;
  var nv={t:t.net,cc:t.cc,risp:t.risp,inv:t.inv,bfp:t.bfp,att:t.att,pas:t.pas};
  if(ex&&Object.keys(nv).every(function(k){return ex[k]===nv[k];})) return false;
  var o=ex||{id:id,d:T};
  Object.assign(o,nv);stamp(o);
  if(!ex) S.pats.push(o);
  save();return true;
}

function lineChart(pts){
  var W=480,H=210,pl=46,pb=26,pt=12,pr=12;
  var lo=Infinity,hi=-Infinity;
  pts.forEach(function(p){if(p.t<lo) lo=p.t;if(p.t>hi) hi=p.t;});
  if(hi-lo<=0){var pd=Math.max(Math.abs(hi)*0.02,10000);lo-=pd;hi+=pd;}
  var step=niceStep((hi-lo)/4),top=Math.ceil(hi/step)*step,bot=Math.floor(lo/step)*step;
  if(top<=bot) top=bot+step;
  var iw=W-pl-pr,ih=H-pt-pb,d0=dayNum(pts[0].d),d1=dayNum(pts[pts.length-1].d),span=Math.max(1,d1-d0),g='';
  function X(d){return pl+(pts.length>1?(dayNum(d)-d0)/span:0.5)*iw;}
  function Y(v){return pt+ih-(v-bot)/(top-bot)*ih;}
  for(var v=bot;v<=top+step/1000;v+=step){
    g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(Y(v)+3)+'" text-anchor="end" font-size="12" fill="var(--muted)">'+shortEur(v)+'</text>';
  }
  var lb=function(d){return span>62?d.slice(5,7)+'/'+d.slice(2,4):d.slice(8)+'/'+d.slice(5,7);};
  var nl=Math.min(pts.length,5);
  for(var i=0;i<nl;i++){
    var p=pts[nl>1?Math.round(i*(pts.length-1)/(nl-1)):0];
    g+='<text x="'+X(p.d)+'" y="'+(H-8)+'" text-anchor="'+(i===0&&nl>1?'start':i===nl-1&&nl>1?'end':'middle')+'" font-size="12" fill="var(--muted)">'+lb(p.d)+'</text>';
  }
  var line=pts.map(function(p,i){return (i?'L':'M')+X(p.d).toFixed(1)+','+Y(p.t).toFixed(1);}).join(' ');
  if(pts.length>1) g+='<path d="'+line+' L'+X(pts[pts.length-1].d).toFixed(1)+','+(pt+ih)+' L'+X(pts[0].d).toFixed(1)+','+(pt+ih)+' Z" fill="var(--accent)" opacity=".1"/>'+
    '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>';
  pts.forEach(function(p,i){
    var last=i===pts.length-1;
    g+='<circle cx="'+X(p.d).toFixed(1)+'" cy="'+Y(p.t).toFixed(1)+'" r="'+(last?4:pts.length>40?0:2.5)+'" fill="var(--accent)"><title>'+fd(p.d)+' · '+eur(p.t)+'</title></circle>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Andamento del patrimonio netto" style="width:100%;height:auto">'+g+'</svg>';
}

// eliminato = c'è una lapide più recente dell'ultima modifica dell'elemento (valore negativo = lapide «morbida» di un'importazione annullata)
function deleted(x){var d=S.del[x.id];return !!d&&(x.u||0)<=Math.abs(d);}
function mergeState(inc){
  var colls=['accounts','cats','rules','tx','bills','rec','snaps','sec','bfp','bfpH','imps','pat','pats'],added=0;
  S.del=Object.assign({},inc.del||{},S.del);
  colls.forEach(function(k){
    S[k]=S[k]||[];
    var cur={};S[k].forEach(function(x){cur[x.id]=x;});
    (inc[k]||[]).forEach(function(x){
      if(!x||!x.id||deleted(x)) return;
      var ex=cur[x.id];
      if(!ex){S[k].push(x);cur[x.id]=x;added++;}
      else if((x.u||0)>(ex.u||0)) Object.assign(ex,x);
    });
    S[k]=S[k].filter(function(x){return !deleted(x);});
  });
  S.px=S.px||{};
  Object.keys(inc.px||{}).forEach(function(k){if(!S.px[k]||(inc.px[k].d||'')>(S.px[k].d||'')) S.px[k]=inc.px[k];});
  S.people=S.people||[];
  (inc.people||[]).forEach(function(p){if(S.people.indexOf(p)<0) S.people.push(p);});
  save();return added;
}
function exportJSON(){
  var blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='conti-casa-'+todayISO()+'.json';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}

  'imp-acct':function(el){imp.acct=el.value;imp.note='';refreshImp();},
  'imp-file':function(el){impFile(el);},
  'imp-hdr':function(el){
    var n=Math.max(1,+el.value||1)-1;
    if(imp.rows&&n<imp.rows.length){imp.hdr=n;imp.map=guessMapping(imp.rows[n]);imp.cmap={};impMeta();refreshImp();}
  },
  'imp-map':function(){impReadMap();refreshImp();},
  'imp-cmap':function(el){imp.cmap[el.dataset.k]=el.value;},
  'imp-opt':function(){
    var f=$('#mform'),g=function(n){return !!(f.elements[n]&&f.elements[n].checked);},o=imp.o;
    if(f.elements.o_cat) {o.cat=g('o_cat');o.over=g('o_over');o.learn=g('o_learn');}
    if(f.elements.o_al) o.al=g('o_al');
    o.skipOld=g('o_old');
    refreshImp();
  }
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el) return;
  var f=H[el.dataset.act];if(f){e.preventDefault();f(el,e);}
});
document.addEventListener('change',function(e){
  var el=e.target.closest('[data-chg]');if(!el) return;
  var f=CH[el.dataset.chg];if(f) f(el,e);
});
var qTimer=null;
document.addEventListener('input',function(e){
  var el=e.target.closest('[data-inp="mv-q"]');if(!el) return;
  clearTimeout(qTimer);qTimer=setTimeout(function(){U.mv.q=el.value;mvReset();},180);
});
$('#jsonFile').addEventListener('change',async function(e){
  var f=e.target.files[0];e.target.value='';if(!f) return;
  try{
    var inc=JSON.parse(await f.text());
    if(!inc||!inc.accounts||!inc.tx) throw new Error('non è un backup di questa app');
    var n=mergeState(inc);render();toast('Backup unito: '+n+' elementi nuovi');
  }catch(err){toast('Importazione non riuscita: '+err.message);}
});

$('#bfpFile').addEventListener('change',async function(e){
  var f=e.target.files[0];e.target.value='';if(!f) return;
  try{
    await loadXLSX();
    var wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    toast(importBfpWorkbook(wb));
  }catch(err){toast('Importazione non riuscita: '+err.message);}
});

$('#secFile').addEventListener('change',async function(e){
  var f=e.target.files[0];e.target.value='';if(!f) return;
  try{
    var rows;
    if(/\.xlsx?$/i.test(f.name)){
      await loadXLSX();
      var wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
    }else{
      var text=decodeText(await f.arrayBuffer());
      rows=parseCSV(text,detectDelimiter(text));
    }
    toast(importDossierRows(rows));
  }catch(err){toast('Importazione non riuscita: '+err.message);}
});

// ===== Modale =====
function openModal(title,html,onSubmit,opts){
  opts=opts||{};
  var dlg=$('#dlg');
  dlg.innerHTML='<form id="mform" method="dialog"><div class="mh"><h2>'+esc(title)+'</h2><button type="button" class="btn ghost sm" data-act="close" aria-label="Chiudi">✕</button></div><div class="mb">'+html+'</div>'+
    '<div class="mf"><button type="button" class="btn" data-act="close">Annulla</button><button class="btn primary" type="submit">'+esc(opts.ok||'Salva')+'</button></div></form>';
  $('#mform').addEventListener('submit',function(e){
    e.preventDefault();
    if(onSubmit&&onSubmit(new FormData(e.target),e.target)===false) return;
    closeModal();
  });
  if(!dlg.open){try{dlg.showModal();}catch(err){dlg.setAttribute('open','');}}
}
function closeModal(){var d=$('#dlg');try{d.close();}catch(e){}d.removeAttribute('open');}

patAuto();
render();
</script>
