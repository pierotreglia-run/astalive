<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#112b4d">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Conti di casa</title>
<style>
:root{color-scheme:light;--bg:#f0f3f8;--head:#112b4d;--card:#fff;--ink:#14243a;--muted:#52687f;--line:#dce4ef;--ctl:#a7b6ca;--accent:#1d5fd1;--accent-ink:#fff;--hl:#8dbaff;--good:#0b6b46;--bad:#b4303f;--warn:#855000;--soft:#e9eff8;--r:12px;--shadow:0 1px 2px rgba(17,43,77,.06)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.42 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
/* intestazione: fascia blu notte, schede come linguette */
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;border-bottom:1px solid #0a1d36}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px 0;max-width:1080px;margin:0 auto}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.005em;display:flex;align-items:center;white-space:nowrap}
h1::before{content:"€";content:"€"/"";display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border-radius:6px;background:var(--hl);color:var(--head);font-size:13px;font-weight:800;line-height:1}
header .muted{color:rgba(255,255,255,.68)}
.hn{font-size:11.5px;text-align:right}
nav{display:flex;gap:2px;overflow-x:auto;padding:2px 14px 0;max-width:1080px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:transparent;color:rgba(255,255,255,.76);padding:8px 11px 9px;border-radius:8px 8px 0 0;font:inherit;font-size:13.5px;font-weight:550;cursor:pointer;box-shadow:inset 0 -2px 0 transparent;transition:background .12s,color .12s}
nav button.on{color:#fff;font-weight:650;box-shadow:inset 0 -2px 0 var(--hl)}
nav button:not(.on):hover{color:#fff;background:rgba(255,255,255,.09)}
header :focus-visible{outline:2px solid var(--hl);outline-offset:-2px}
main{max-width:1080px;margin:0 auto;padding:12px 14px 64px}
/* schede */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card h2{font-size:13.5px;margin:0 0 8px;font-weight:650}
.grid{display:grid;gap:10px}
/* fascia dei totali: una sola scheda, colonne separate da filetti */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 14px 10px;box-shadow:var(--shadow);min-width:0}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:500}
.kpi .val{font-size:20px;font-weight:650;margin-top:1px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.35}
.kpis{grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:0;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.kpis>.kpi{background:transparent;border:0;border-radius:0;box-shadow:-1px 0 0 var(--line),0 -1px 0 var(--line)}
.card .kpis{box-shadow:none;border-radius:9px}
.kpis>.kpi.hero{background:var(--head);color:#fff;padding:12px 16px 13px;box-shadow:none}
.kpi.hero .lbl,.kpi.hero .sub{color:rgba(255,255,255,.76)}
.kpi.hero .val{font-size:28px;font-weight:700;letter-spacing:-.015em}
.kpi.hero .good{color:#7fe3b2}.kpi.hero .bad{color:#ffa7b1}
.two{grid-template-columns:1fr;align-items:start}
@media(min-width:860px){.two{grid-template-columns:1fr 1fr}}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.grow{flex:1}
.mnav{display:flex;gap:4px;align-items:center}
/* controlli */
input,select,textarea{font:inherit;font-size:13.5px;color:var(--ink);background:var(--card);border:1px solid var(--ctl);border-radius:8px;padding:5px 9px;min-width:0;accent-color:var(--accent)}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px}
label>input,label>select{display:block;width:100%;margin-top:3px;color:var(--ink)}
label.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
label.chk input{width:auto;margin:0;flex:none}
.btn{font:inherit;font-size:13px;font-weight:600;line-height:1.35;border:1px solid var(--ctl);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 11px;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#174fb0;border-color:#174fb0}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.muted{color:var(--muted)}
.sm{font-size:12px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.gr,.txa,.pv,.prow,.lg,.bars .r,.brg td,.alr{font-variant-numeric:tabular-nums}
/* giroconti */
.gr{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:1px 10px;padding:7px 0;border-bottom:1px solid var(--line)}.gr:last-child{border-bottom:0}.gr .ga{text-align:right;white-space:nowrap}.gr .gsub{font-size:11.5px;margin:1px 0 3px}.gr select{width:100%;max-width:240px;padding:3px 8px;font-size:13px}
@media(max-width:700px){.gr{grid-template-columns:minmax(0,1fr) auto}.gr .gd{grid-column:1;grid-row:1}.gr .ga{grid-column:2;grid-row:1}.gr .gm{grid-column:1/-1;grid-row:2}}
.gsum{margin:0 0 8px;padding-left:18px}.gsum li{margin:2px 0}
.brg{width:100%;max-width:440px;border-collapse:collapse}.brg td{padding:4px 4px;border-bottom:1px dashed var(--line)}.brg tr.op td,.brg tr.tot td{font-weight:650}.brg tr.tot td{border-top:2px solid var(--ctl);border-bottom:0}
.gact{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}.gact select{flex:1 1 200px}
.warnline{font-size:12.5px;color:var(--warn);margin:2px 0 6px}
.pill{display:inline-block;font-size:11.5px;line-height:1.5;padding:0 7px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
/* barre per categoria */
.bars .r{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.bars .track{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bars .fill{height:100%;border-radius:99px}
.bars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* righe di movimento */
.tx{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.tx:last-child{border-bottom:0}
.txd{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.txs{font-size:11.5px;color:var(--muted)}
.txa{font-weight:600;text-align:right}
.txc{grid-column:1/-1;display:flex;gap:6px;align-items:center}
.txc select{flex:1;min-width:0;padding:3px 8px;font-size:13px}
@media(min-width:760px){.tx{grid-template-columns:1fr 110px 270px}.txc{grid-column:auto}}
/* tabelle */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:5px 8px;border-bottom:1px solid var(--ctl)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.pos{padding:10px 0;border-bottom:1px solid var(--line)}
.pos:last-child{border-bottom:0}
.pos .ph{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;align-items:baseline}
.pos .pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px 12px;margin-top:6px}
.pos .l{font-size:11.5px;color:var(--muted)}
.pos .v{font-variant-numeric:tabular-nums;font-weight:550}
.pos input{width:100%;max-width:120px}
.bf{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.bf:last-child{border-bottom:0}
.bf .bi{grid-column:1/-1;min-width:0}
.bf .bt{word-break:break-word}
@media(min-width:700px){.bf{grid-template-columns:1fr auto auto}.bf .bi{grid-column:auto}}
.right{text-align:right}
/* conti */
.acc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;align-items:start}
.acc .card{margin:0;display:flex;flex-direction:column;gap:4px}
.acc .big{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.acc .btns{display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.empty{text-align:center;padding:22px 12px;color:var(--muted)}
/* finestre, avvisi */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 18px 48px rgba(10,24,48,.3)}
dialog::backdrop{background:rgba(10,24,48,.45)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 0}
.mh h2{margin:0;font-size:16px}
.mb{padding:10px 14px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:0 14px 14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--head);color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:92vw;box-shadow:0 6px 20px rgba(10,24,48,.25)}
#toast.on{opacity:1}
#banner{max-width:1080px;margin:0 auto;padding:0 14px}
#banner:not(:empty){padding-top:10px}
.bn{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--card);border-radius:9px;padding:8px 12px;margin:0 0 8px;font-size:13px}
.bn.bad{border-left-color:var(--bad)}
.bn .btn{margin:4px 6px 0 0}
.note{font-size:12.5px;color:var(--muted);margin:5px 0 0}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px}
/* elenco movimenti */
.mvt th{white-space:nowrap}
.sortb{font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:none;border:0;padding:2px 0;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.sortb:hover{color:var(--ink)}
.sortb.on{color:var(--accent)}
.sortb .ar{font-size:10px}
.mvt td{padding:5px 8px}
.mvt tbody tr:hover{background:#f5f8fc}
.mvt td.c-d{white-space:nowrap;color:var(--ink);font-weight:500}
.mvt td.c-s{min-width:200px;max-width:440px}
.mvt td.c-a{white-space:nowrap}
.mvt td.c-c select{width:100%;max-width:210px;padding:3px 8px;font-size:12.5px}
.mvt td.c-m{white-space:nowrap;font-weight:600}
.mvt td.c-x{white-space:nowrap;text-align:right}
.mvt .c-chk{width:28px}
.mvt tr.sel,.mvt tr.sel:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
#mvBar{position:sticky;top:var(--hh,70px);z-index:4}
.bulk{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;background:var(--card);border:1px solid var(--ctl);border-radius:10px;padding:6px 10px;margin:0 0 8px;box-shadow:0 4px 14px rgba(17,43,77,.12)}
.bulk select{max-width:210px;padding:3px 8px;font-size:12.5px}
.mobonly{display:none}
.mvsort{display:none}
.mvsel{display:none;margin:2px 0 6px}
.alr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:3px 0;border-bottom:1px solid var(--line)}
.alr input{width:130px;text-align:right}
.cmr{display:grid;gap:3px 12px;padding:6px 0;border-bottom:1px solid var(--line)}
.cmr:last-child{border-bottom:0}
.cmr select{width:100%;min-width:0}
@media(min-width:560px){.cmr{grid-template-columns:1fr 1fr;align-items:center}}
@media(max-width:759px){
  .mvt thead{display:none}
  .mvt,.mvt tbody{display:block}
  .mvt tr{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"chk d m" "chk s s" "chk c x";gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
  .mvt td{display:block;padding:0;border:0;min-width:0}
  .mvt td.c-chk{grid-area:chk;width:auto}
  .mvt td.c-d{grid-area:d}
  .mvt td.c-s{grid-area:s;min-width:0;max-width:none}
  .mvt td.c-a{display:none}
  .mvt td.c-c{grid-area:c}
  .mvt td.c-c select{max-width:none}
  .mvt td.c-m{grid-area:m;text-align:right}
  .mvt td.c-x{grid-area:x}
  .mobonly{display:inline}
  .mvsort{display:block}
  .mvsel{display:flex}
}
/* patrimonio e investimenti */
.pk{grid-template-columns:repeat(3,1fr)}
.pk>.hero{grid-column:1/-1}
.pgh{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}
.prow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.prow>div:first-child{min-width:0;overflow-wrap:anywhere}
.pv{text-align:right;flex:none}
.psm{font-size:11.5px}
.sbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft);margin:4px 0 8px}
.sbar i{display:block;height:100%}
.lg{display:flex;align-items:center;gap:8px;padding:2px 0;font-size:13px}
.lg .nm{flex:1;min-width:0}
.lg .lgp{width:38px;text-align:right}
@media(max-width:520px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpis>.kpi:last-child:nth-child(odd){grid-column:1/-1}
  .pk>.kpi:last-child:nth-child(even){grid-column:1/-1}
  .kpi .val{font-size:18px}
  .kpi.hero .val{font-size:26px}
}
/* note, riepilogo, regole */
label>textarea{display:block;width:100%;margin-top:3px;resize:vertical}
.tnote{display:inline-block;max-width:100%;margin-top:2px;font-size:11.5px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:0 7px;overflow-wrap:anywhere;cursor:pointer}
.btn.hasnote{background:var(--soft);border-color:var(--accent)}
.rprev{margin-top:4px}
.rxh{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-bottom:6px;font-size:12.5px}
.rxl{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:2px 8px}
.rx{display:grid;grid-template-columns:auto auto 1fr auto;gap:6px 8px;align-items:start;padding:5px 0;border-bottom:1px solid var(--line);margin:0;font-size:12.5px;color:var(--ink);cursor:pointer}
.rx:last-child{border-bottom:0}
.rx>input{display:inline-block;width:auto;margin:2px 0 0}
.rxs{min-width:0;overflow-wrap:anywhere}
.rxd0{color:var(--muted)}
.rg{border-bottom:1px solid var(--line)}
.rg>summary{display:flex;gap:8px;align-items:flex-start;padding:5px 0;list-style:none;cursor:pointer;color:var(--ink);font-size:12.5px}
.rg>summary::-webkit-details-marker{display:none}
.rg>summary::after{content:'▸';margin-left:auto;color:var(--muted)}
.rg[open]>summary::after{content:'▾'}
.rg>summary input{margin:2px 0 0;flex:none}
.rgrows{padding:0 0 4px 22px}
/* vista per mese */
.pm{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
.pm th,.pm td{padding:4px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.pm th{font-weight:600;color:var(--muted);font-size:11.5px;vertical-align:bottom;padding:4px 4px;border-bottom-color:var(--ctl)}
.pm th:first-child,.pm td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:128px;max-width:170px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
.pm .pmh{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer;padding:2px 4px;border-radius:6px;line-height:1.15}
.pm .pmh:hover{background:var(--soft)}
.pm .pmh small{display:block;font-weight:400}
.pm th.cur{color:var(--accent)}
.pm th.fut,.pm td.fut{font-style:italic}
.pm tr.sec td{background:var(--soft);font-weight:650;color:var(--ink);font-size:12px}
.pm tr.tot td{font-weight:650;background:var(--card)}
.pm td.pmc{cursor:pointer}
.pm td.pmc:hover{outline:2px solid var(--accent);outline-offset:-2px}
.pm td.over{color:var(--bad);font-weight:650}
.pm td.pmz{color:#5f7592}
.pm td.cur{box-shadow:inset 2px 0 0 var(--accent)}
.pm .tc,.pm .ta{border-left:1px solid var(--line);font-weight:600}
.pm .dot{width:8px;height:8px;margin-right:4px;vertical-align:baseline}
@media(max-width:520px){.pm th:first-child,.pm td:first-child{min-width:108px;max-width:126px}}
/* tastiera, tocco, tabella «spese più alte» */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0}
.pm td.pmc:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;background:var(--soft)}
dialog #toast{position:fixed}
.tt td.tcat{width:1%}
@media(max-width:560px){.tt td.tcat{display:none}.tt .tcatm{display:block;font-size:11.5px;color:var(--muted)}}
.tcatm{display:none}
/* telefono: margini stretti, intestazione corta */
@media(max-width:560px){
  .top{padding:7px 12px 0}
  nav{padding:2px 8px 0}
  main{padding:10px 10px 56px}
  .card{padding:10px 12px}
  .hn1{display:none}
}
@media(pointer:coarse){
  .btn.sm{min-height:36px;padding:6px 11px}
  nav button{padding:10px 12px 11px}
  input:not([type=checkbox]):not([type=radio]),select{min-height:38px}
  input[type=checkbox]{width:22px;height:22px}
  label.chk input[type=checkbox]{flex:none}
  .mvt td.c-c select{padding:5px 8px}
  dialog input:not([type=checkbox]):not([type=radio]),dialog textarea{font-size:16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* telefono: rifiniture (schede scorrevoli, zoom iOS, area sicura, barra del browser) */
@media(max-width:700px){
  nav{padding-right:36px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent)}
}
@supports (-webkit-touch-callout:none){
  input,select,textarea{font-size:16px}
  .mvt td.c-c select,.bulk select,.txc select,.gr select,.cmr select{font-size:16px}
}
header{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
main,#banner{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
@media(max-width:560px){main{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}}
main{padding-bottom:calc(56px + env(safe-area-inset-bottom))}
#toast{bottom:calc(20px + env(safe-area-inset-bottom))}
dialog{max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px)}
@media(pointer:coarse){.btn{min-height:36px}}
input[readonly]{background:var(--soft);color:var(--ink);border-color:var(--line);cursor:default}
input[readonly]:focus{outline:0}

.bars .rb{width:100%;text-align:left;background:none;border:0;color:inherit;font-family:inherit;cursor:pointer;border-radius:8px;margin:0}
.bars .rb>span,.bars .rb .fill{display:block}
.bars .rb:hover{background:var(--soft)}

<script>
// ==CORE==
// Funzioni pure (testabili in Node): parsing, dedup, regole, giroconti, saldo.
function cyrb53(str, seed){
  seed=seed||0;
  var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;
  for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
function normDesc(s){
  return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
}
function parseAmount(v){return parseNum(v,'amt');}
function pad2(n){return (n<10?'0':'')+n;}
function parseDate(v){
  if(v==null||v==='') return null;
  function ymd(y,m,d){return validYMD(y,m,d)?y+'-'+pad2(m)+'-'+pad2(d):null;}
  if(v instanceof Date){
    if(isNaN(v.getTime())) return null;
    var d0=new Date(v.getTime()+12*3600*1000);
    return ymd(d0.getUTCFullYear(),d0.getUTCMonth()+1,d0.getUTCDate());
  }
  if(typeof v==='number'){
    if(v>20000&&v<80000){
      var d1=new Date(Math.round((v-25569)*86400000));
      return ymd(d1.getUTCFullYear(),d1.getUTCMonth()+1,d1.getUTCDate());
    }
    return null;
  }
  var s=String(v).trim(),m;
  if((m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?!\d)/))) return ymd(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})(?!\d)/))){
    var y2=+m[3];
    if(y2<100) y2+=2000;
    return ymd(y2,+m[2],+m[1]);
  }
  return null;
}
function parseCSV(text,delim){
  text=text.replace(/^﻿/,'');
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else{
      // la virgoletta apre un campo solo all'inizio del campo; in mezzo (es. «Tubo 5" nuovo») è un carattere normale
      if(c==='"'&&/^\s*$/.test(cur)){q=true;cur='';}
      else if(c===delim){row.push(cur);cur='';}
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur);cur='';rows.push(row);row=[]; }
      else cur+=c;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});
}
function detectDelimiter(text){
  var lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(function(l){return l.trim();}).slice(0,60);
  var best=';',bestScore=-1,cands=[';','\t',',','|'];
  cands.forEach(function(d){
    var counts=lines.map(function(l){return l.split(d).length-1;}).filter(function(n){return n>0;});
    if(!counts.length) return;
    var freq={};counts.forEach(function(n){freq[n]=(freq[n]||0)+1;});
    var mode=0,mf=0;
    for(var k in freq){ if(freq[k]>mf||(freq[k]===mf&&+k>mode)){mf=freq[k];mode=+k;} }
    var score=mf*mode;
    if(score>bestScore){bestScore=score;best=d;}
  });
  return best;
}
function findHeaderRow(rows){
  var lim=Math.min(rows.length,40);
  for(var i=0;i<lim;i++){
    var cells=(rows[i]||[]).map(function(x){return String(x==null?'':x).toLowerCase().replace(/[_\-.]+/g,' ').trim();}).filter(function(x){return x&&x.length<=40;});
    var hasDate=cells.some(function(x){return /\bdata\b|\bdate\b/.test(x);});
    var hasAmt=cells.some(function(x){return /importo|amount|\bdare\b|\bavere\b|entrat|uscit|addebit|accredit/.test(x);});
    if(hasDate&&hasAmt) return i;
  }
  return -1;
}
function guessMapping(h){
  var low=h.map(function(x){return String(x==null?'':x).toLowerCase().replace(/_+/g,' ').replace(/\s+/g,' ').trim();});
  function find(re){for(var i=0;i<low.length;i++) if(re.test(low[i])) return i; return -1;}
  var date=find(/data.*(contabil|operaz)|^data$|^date$/);
  if(date<0) date=find(/data|date/);
  var amount=find(/^importo|^amount|^valore/);
  var inCol=-1,outCol=-1;
  if(amount<0){inCol=find(/entrat|avere|accredit/);outCol=find(/uscit|dare|addebit/);}
  var cat=find(/cluster ?2|sottocateg/);
  if(cat<0) cat=find(/^categori|^cluster|^etichett|^tag$/);
  var cy=-1,cm=-1,comp=-1;
  low.forEach(function(x,i){
    if(i>date&&/^anno( di competenza)?$/.test(x)) cy=i;
    if(i>date&&/^mese( di competenza)?$/.test(x)) cm=i;
  });
  if(cy<0||cm<0){cy=-1;cm=-1;comp=find(/competenza/);}
  var descs=[];
  low.forEach(function(x,i){
    if(i===date||i===amount||i===inCol||i===outCol||i===cat||i===cy||i===cm||i===comp) return;
    if(/data/.test(x)) return;
    if(/descri|causale|dettagl|motivo|beneficiar|controparte|note|operazione|riferiment|parola chiave|movimento|osservaz|concetto/.test(x)) descs.push(i);
  });
  if(!descs.length){
    for(var j=0;j<low.length;j++){ if(j!==date&&j!==amount&&j!==inCol&&j!==outCol&&j!==cat&&j!==cy&&j!==cm&&j!==comp&&!/saldo|valuta|data/.test(low[j])&&low[j]){descs.push(j);break;} }
  }
  return {date:date,amount:amount,inCol:inCol,outCol:outCol,descs:descs,cat:cat,cy:cy,cm:cm,comp:comp};
}
function parseRows(rows,hdr,map,invert){
  var items=[],skipped=0;
  for(var i=hdr+1;i<rows.length;i++){
    var r=rows[i]||[];
    var d=map.date>=0?parseDate(r[map.date]):null;
    var amt=null;
    if(map.amount>=0) amt=parseAmount(r[map.amount]);
    else{
      var a=map.inCol>=0?parseAmount(r[map.inCol]):null,b=map.outCol>=0?parseAmount(r[map.outCol]):null;
      if(a!=null||b!=null) amt=Math.abs(a||0)-Math.abs(b||0);
    }
    if(!d||amt==null){skipped++;continue;}
    if(invert) amt=-amt;
    var parts=[];
    map.descs.forEach(function(c){
      var v=String(r[c]==null?'':r[c]).replace(/\s+/g,' ').trim();
      if(v&&parts.indexOf(v)<0) parts.push(v);
    });
    var it={d:d,cents:roundCents(amt),amt:amt,s:parts.join(' \u00b7 ')};
    if(map.cat>=0){
      var cv=String(r[map.cat]==null?'':r[map.cat]).replace(/\s+/g,' ').trim();
      if(cv){it.cl=cv;if(!it.s) it.s='Voce manuale \u00b7 '+cv;}
    }
    var ym=null;
    if(map.cy>=0&&map.cm>=0){var yy=parseInt(r[map.cy],10),mm=monthNum(r[map.cm]);if(yy>1990&&yy<2100&&mm) ym=yy+'-'+pad2(mm);}
    else if(map.comp>=0) ym=parseYM(r[map.comp]);
    if(ym) it.ym=ym;
    items.push(it);
  }
  if(items.some(function(i){return i.ym;})) items=mergeSplits(items);
  return {items:items,skipped:skipped};
}
function assignIds(items,acctId){
  var seen={};
  items.forEach(function(t){
    var k=acctId+'|'+t.d+'|'+t.cents+'|'+normDesc(t.s);
    var n=seen[k]||0;seen[k]=n+1;
    t.id='i'+cyrb53(k).toString(36)+'.'+n;
  });
  return items;
}
// parola chiave di una regola: «ENEL» = parola intera · «AMAZON*» = inizia con · «*AMAZON» = finisce con · «*AMAZON*» = contiene · solo asterischi = non valida
function kwRegex(kw){
  kw=normDesc(kw);
  var lead=false,trail=false;
  if(kw.charAt(0)==='*'){lead=true;kw=kw.replace(/^\*+/,'');}
  if(kw.charAt(kw.length-1)==='*'){trail=true;kw=kw.replace(/\*+$/,'');}
  kw=kw.trim();
  if(!kw) return null;
  var esc=kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return new RegExp((lead?'':'(^|[^A-Z0-9])')+esc+(trail?'':'($|[^A-Z0-9])'));
}
function kwMatch(norm,kw){var re=kwRegex(kw);return !!re&&re.test(norm);}
function compileRules(rules){
  return rules.map(function(r){return {re:kwRegex(r.k),c:r.c};}).filter(function(r){return r.re;});
}
function categorize(desc,compiled){
  var n=normDesc(desc);
  for(var i=0;i<compiled.length;i++) if(compiled[i].re.test(n)) return compiled[i].c;
  return null;
}
function dayNum(iso){var p=iso.split('-');return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000);}
// touch(t): chiamata per ogni movimento la cui categoria cambia (l'app aggiorna la data di modifica, così la correzione arriva anche agli altri dispositivi)
function detectTransfers(txs,giroId,maxDays,rispId,touch){
  if(!giroId) return 0;
  maxDays=maxDays==null?4:maxDays;
  var pool=txs.filter(function(t){return (t.c==null&&!notTransferText(t.s))||t.c===giroId||(rispId&&t.c===rispId&&t.m<0);});
  var negs={};
  pool.forEach(function(t){ if(t.m<0){(negs[-t.m]=negs[-t.m]||[]).push(t);} });
  var used={},pairs=0;
  pool.filter(function(t){return t.m>0&&(t.c==null||t.c===giroId);}).forEach(function(p){
    if(used[p.id]) return;
    var list=negs[p.m]||[],best=null,bd=1e9;
    list.forEach(function(n){
      if(used[n.id]||n.a===p.a) return;
      var dd=Math.abs(dayNum(n.d)-dayNum(p.d));
      if(dd<=maxDays&&dd<bd){best=n;bd=dd;}
    });
    if(best){
      used[best.id]=1;used[p.id]=1;
      var nc=(rispId&&best.c===rispId)?rispId:giroId;
      if(p.c!==giroId||best.c!==nc){
        if(p.c!==giroId){p.c=giroId;if(touch) touch(p);}
        if(best.c!==nc){best.c=nc;if(touch) touch(best);}
        pairs++;
      }
    }
  });
  return pairs;
}
// saldo calcolato: saldo di riferimento + movimenti successivi; con upTo (AAAA-MM-GG) esclude i movimenti futuri
function computeBalance(acc,txs,upTo){
  if(!acc||!acc.anchor) return null;
  var b=acc.anchor.m;
  for(var i=0;i<txs.length;i++){var t=txs[i]; if(t.a===acc.id&&t.d>acc.anchor.d&&(!upTo||t.d<=upTo)) b+=t.m;}
  return b;
}
function suggestKw(desc){
  var stop={PAGAMENTO:1,POS:1,CARTA:1,ADDEBITO:1,DIRETTO:1,SDD:1,BONIFICO:1,FAVORE:1,ORDINANTE:1,SEPA:1,ACCREDITO:1,PRELIEVO:1,COMMISSIONI:1,PAGAMENTI:1,OPERAZIONE:1,DEL:1,CON:1,PER:1,NUMERO:1,CAUSALE:1,DISPOSIZIONE:1,ONLINE:1,CIRCUITO:1,VISA:1,MASTERCARD:1,DEBIT:1,ITALIA:1,ITA:1,EUR:1};
  var toks=normDesc(desc).replace(/[^A-Z0-9 ]/g,' ').split(' ').filter(function(t){return t.length>=3&&!/^\d+$/.test(t)&&!stop[t];});
  return toks.slice(0,2).join(' ');
}
function decodeText(buf){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){return new TextDecoder('windows-1252').decode(buf);}
}

function normIban(s){return String(s==null?'':s).replace(/\s+/g,'').toUpperCase();}
function shortDesc(s){
  s=String(s==null?'':s).replace(/\s+/g,' ').trim();
  var caus='',d=s,i=s.indexOf(' · '),m;
  if(i>0){caus=s.slice(0,i);d=s.slice(i+3);}
  function note(){
    var n=d.match(/Note:\s*(.+)$/i);
    var t=n&&n[1].trim();
    if(!t||/^giroconto$/i.test(t)) return '';
    return ' — '+(t.length>70?t.slice(0,67)+'…':t);
  }
  if(i>0){
    if(/^Pag\.?\s*finanziamento/i.test(caus)) return 'Rata '+(/mutuo/i.test(d)?'mutuo':'finanziamento');
    if(/^Costo Bonifico/i.test(caus)) return 'Costo '+(/istantaneo/i.test(caus)?'bonifico istantaneo':'bonifico');
    if((m=caus.match(/^Bonifico (Istantaneo )?Da Voi Disposto A Favore Di\s+(.+)$/i))) return 'Bonifico '+(m[1]?'istantaneo ':'')+'a '+m[2].trim();
    if(/^Stipendio o pensione/i.test(caus)){var cmp=d.match(/COMPETENZE\s+MESE DI\s+([A-Za-zÀ-ù]+)(?:\s+(\d{4}))?/i);return 'Stipendio'+(cmp?' · competenze '+cmp[1].toLowerCase()+(cmp[2]?' '+cmp[2]:''):'');}
    if(/^Canone Mensile/i.test(caus)){var cn=d.match(/Mese di\s+([A-Za-zÀ-ù]+)/i);return 'Canone conto'+(cn?' · '+cn[1].toLowerCase():'');}
    if(/^Vers\.?\s*contanti/i.test(caus)) return 'Versamento contanti';
    if(/^Versamento Assegni Circolari/i.test(caus)) return 'Versamento assegni circolari';
  }
  if((m=d.match(/^Dt\.conf:.*?Dt\.pag:\s*(\d{1,2}\/\d{1,2}\/\d{4})/i))) return 'Pagamento F24/I24 · pag. '+m[1];
  if((m=d.match(/\bpresso\s+(.+)$/i))){
    var who=m[1].trim();
    if(/prelievo/i.test(caus)||/^prelievo/i.test(d)) return 'Prelievo contanti · '+who;
    return who;
  }
  if((m=d.match(/Creditor id\.?\s*\S+\s+(.+?)\s+Id Mandato/i))) return 'Addebito diretto · '+m[1].trim();
  if((m=d.match(/^Compravendita Titoli\s+(.+?)\s+Qta\/Val\.nom\.\s*([\d.,]+)/i))){
    var qn=parseAmount(m[2]);
    return 'Acquisto titoli · '+m[1].trim()+(qn!=null?' × '+fmtNum(qn,0,3):'');
  }
  function fnote(){
    var n2=d.match(/(?:Causale|Info-Cli):\s*(.+)$/i),t2=n2&&n2[1].trim();
    if(!t2||/^giroconto$/i.test(t2)) return '';
    return ' — '+(t2.length>70?t2.slice(0,67)+'…':t2);
  }
  if((m=d.match(/Ordinante:\s*(.+?)\s+Beneficiari/i))) return 'Bonifico da '+m[1].trim()+fnote();
  if((m=d.match(/\bOrd:\s*(.+?)\s+Ben:/i))) return 'Bonifico da '+m[1].trim()+fnote();
  var kind=/giroconto/i.test(caus)?'Giroconto':'Bonifico';
  if((m=d.match(/A favore di\s+(.+?)\s+(?:IBAN|C\.\s*BENEF)/i))) return kind+' a '+m[1].trim()+note();
  if((m=d.match(/Anagrafica Ordinante\s+(.+?)(?:\s+Note:|$)/i))) return kind+' da '+m[1].trim()+note();
  if(d.length>140) d=d.slice(0,137)+'…';
  return (/storno/i.test(caus)?'Storno · ':'')+d;
}
function parseStatementMeta(rows,hdr){
  var meta={iban:null,num:null,ini:null,fin:null,from:null,to:null,holder:null};
  var lim=Math.min(Math.max(hdr,0),40);
  for(var i=0;i<lim;i++){
    var line=(rows[i]||[]).map(function(x){return x==null?'':String(x);}).join(' ').replace(/\s+/g,' ').trim(),m;
    if(!line) continue;
    if((m=line.match(/IBAN\W*([A-Za-z]{2}\d{2}[A-Za-z0-9 ]{11,40})/))){
      var ib=normIban(m[1]);
      meta.iban=/^IT/.test(ib)?ib.slice(0,27):ib.slice(0,34);
    }
    if((m=line.match(/saldo\s+iniziale[^\d+\-]*([+\-]?\s*[\d.]+,\d{2})/i))) meta.ini=parseAmount(m[1]);
    if((m=line.match(/saldo\s+finale[^\d+\-]*([+\-]?\s*[\d.]+,\d{2})/i))) meta.fin=parseAmount(m[1]);
    if((m=line.match(/dal:?\s*(\d{1,2}\/\d{1,2}\/\d{4})\s*al:?\s*(\d{1,2}\/\d{1,2}\/\d{4})/i))){meta.from=parseDate(m[1]);meta.to=parseDate(m[2]);}
    if((m=line.match(/Intestazione[^:]*:\s*(.+)$/i))) meta.holder=m[1].trim();
    if((m=line.match(/(?:n\.\s*di\s*conto|conto\s+corrente|dossier\s*n\.?)\s*:?\s*(\d{5,})/i))) meta.num=m[1];
    if(!meta.num&&(m=line.match(/\bconto\s+(\d{4})\/(\d{8})\b/i))) meta.num=m[1]+m[2];
  }
  if(meta.fin==null&&hdr>=0&&rows[hdr]){
    var hl=rows[hdr].map(function(x){return String(x==null?'':x).toLowerCase().replace(/[_\-.]+/g,' ').trim();}),cs=-1,cd=-1;

    }
    if(!g){g={d:it.d,cl:it.cl||'',nd:nd,rows:[]};groups.push(g);}

  });

    if(bn>=minN&&bn/o.n>=minP) (cand[best]=cand[best]||[]).push({k:t,c:best,n:bn,p:bn/o.n});

    var list=cand[c].sort(function(a,b){return b.n-a.n||b.k.length-a.k.length;}),covered={};

// Se è pieno o bloccato, i dati vanno qui, che ha molto più spazio; all'avvio si uniscono (senza mai perdere nulla) ai dati di localStorage.
var IDB_NAME='conti_casa_db',IDB_STORE='kv',idbState={ready:false,busy:false,want:false,on:false,cbs:[]};
function idbOpen(cb){
  var done=false,fin=function(e,db){if(done){if(db){try{db.close();}catch(x){}}return;}done=true;cb(e,db);};
  if(typeof indexedDB==='undefined'||!indexedDB){fin(new Error('IndexedDB non disponibile'));return;}
  try{
    var rq=indexedDB.open(IDB_NAME,1);
    rq.onupgradeneeded=function(){try{rq.result.createObjectStore(IDB_STORE);}catch(e){}};
    rq.onsuccess=function(){fin(null,rq.result);};
    rq.onerror=function(){fin(rq.error||new Error('IndexedDB'));};
    rq.onblocked=function(){fin(new Error('IndexedDB bloccato'));};
  }catch(e){fin(e);}
}
function idbPut(val,cb){
  idbOpen(function(e,db){
    if(e){cb(e);return;}
    var done=false,end=function(er){if(done) return;done=true;try{db.close();}catch(x){}cb(er);};
    try{
      var tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(val,'state');
      tx.oncomplete=function(){end(null);};
      tx.onerror=tx.onabort=function(){end(tx.error||new Error('IndexedDB'));};
    }catch(e2){end(e2);}
  });
}
function idbGet(cb){
  idbOpen(function(e,db){
    if(e){cb(e);return;}
    var done=false,end=function(er,v){if(done) return;done=true;try{db.close();}catch(x){}cb(er,v);};
    try{
      var rq=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get('state');
      rq.onsuccess=function(){end(null,rq.result);};
      rq.onerror=function(){end(rq.error||new Error('IndexedDB'));};
    }catch(e2){end(e2);}
  });
}

function idbMirror(cb){

function idbRun(){
  var cbs=idbState.cbs,v;

  try{v=JSON.stringify(S);}catch(e){idbState.busy=false;cbs.forEach(function(f){if(f) f(e);});return;}
  idbPut(v,function(err){
    idbState.busy=false;
    cbs.forEach(function(f){if(f) f(err);});

// all'avvio: se nell'archivio di riserva ci sono dati (perché localStorage era pieno), si uniscono a quelli di localStorage

function save(){

  try{cur=localStorage.getItem(KEY);}catch(e){lsErr=e;}

    h+='<div class="card"><h2>Spese più alte del mese</h2><div class="scroll"><table class="tt"><tbody>'+top.map(function(t){var c=catById(t.c),cn=esc(c?c.n:'Da categorizzare');return '<tr><td class="muted num">'+fd(t.d)+'</td><td>'+esc(shortDesc(t.s))+(t._p?' <span class="muted">(quota di '+esc(eur(t._tot))+')</span>':'')+'<span class="tcatm">'+cn+'</span></td><td class="tcat"><span class="pill">'+cn+'</span></td><td class="right num bad">'+eur(t.m)+'</td></tr>';}).join('')+'</tbody></table></div></div>';
  }
  h+=hp+checkCard(a,m)+giroCard(a,m);
  return h;
}

function pmDefaults(){return {range:'12',acct:'all',cash:false,sort:'tot'};}
function fmt0(c){return fmtNum(Math.round(c/100),0,0);}
function pmYears(){
  var lo=null,hi=+thisYM.slice(0,4);
  S.tx.forEach(function(t){var y=+t.d.slice(0,4);if(lo==null||y<lo) lo=y;if(y>hi) hi=y;});
  var out=[];for(var y=hi;y>=(lo==null?hi:lo);y--) out.push(String(y));
  return out;
}
function viewPm(){
  var P=U.pm,types={};

  var M=monthMatrix(S.tx,months,types,mopt),cutM=allMonths.filter(function(ym){return months.indexOf(ym)<0;});

    '<select data-chg="pm-acct" aria-label="Conto"><option value="all">Tutti i conti</option>'+movAccounts().map(function(x){return opt(x.id,x.n,P.acct);}).join('')+'</select>'+
    '<select data-chg="pm-sort" aria-label="Ordina le categorie per" title="Come ordinare le righe delle categorie">'+opt('tot','Ordina per totale',P.sort)+opt('avg','Ordina per media',P.sort)+months.slice().reverse().map(function(ym){return opt('m:'+ym,'Ordina per '+mshort(ym)+' '+ym.slice(2,4),P.sort);}).join('')+opt('name','Ordina per nome (A→Z)',P.sort)+'</select>'+
    '<label class="chk" style="margin:0" title="Una spesa ripartita su più mesi (es. 3 mesi di condominio pagati insieme) conta per la quota di ciascun mese. Togli la spunta per contare tutto nel mese del pagamento."><input type="checkbox" data-chg="pm-comp"'+(P.cash?'':' checked')+'> per competenza</label></div></div>';
  if(!S.tx.length||!M.count){
    return h+'<div class="card"><div class="empty">'+(S.tx.length?'Nessun movimento nel periodo scelto.':'Nessun movimento: importa un estratto conto dalla scheda Movimenti.')+'</div></div>';

    '<div class="kpi"><div class="lbl">Spese medie al mese</div><div class="val bad">'+eur(Math.round(aUsc))+'</div><div class="sub">su '+na+(na===1?' mese':' mesi')+(avgM.length&&avgM[avgM.length-1]===thisYM?' (compreso quello in corso)':' completi')+'</div></div>'+
    '<div class="kpi"><div class="lbl">Entrate medie al mese</div><div class="val good">'+eur(Math.round(aEnt))+'</div><div class="sub">giroconti esclusi</div></div>'+
    '<div class="kpi"><div class="lbl">Differenza media</div><div class="val '+(aEnt-aUsc>=0?'good':'bad')+'">'+eurS(Math.round(aEnt-aUsc))+'</div><div class="sub">entrate − spese al mese</div></div>'+
    (curU!=null?'<div class="kpi"><div class="lbl">Spese del mese in corso</div><div class="val">'+eur(curU)+'</div><div class="sub">'+(vs==null?'':'<span class="'+(vs>0?'bad':'good')+'">'+(vs>0?'▲ +':'▼ ')+nf(vs)+'%</span> rispetto alla media')+'</div></div>':'')+'</div>';
  h+='<div class="card"><h2>Entrate e spese per mese</h2>'+barChart(months.map(mshort),[{name:'Entrate',color:'var(--good)',values:M.ent.map(function(v){return Math.max(0,v);})},{name:'Spese',color:'var(--bad)',values:M.usc.map(function(v){return Math.max(0,v);})}])+
    '<div class="note"><span class="good">■</span> entrate &nbsp; <span class="bad">■</span> spese (giroconti esclusi)</div></div>';
  // tabella
  var head='<tr><th>Categoria</th>'+months.map(function(ym){
    var cur=ym===thisYM,fut=ym>thisYM;

  }).join('')+'<th class="tc">Totale</th><th class="ta" title="Media dei mesi completi, dal primo mese con dati">Media</th></tr>';
  function tot(arr){return arr.reduce(function(s,v){return s+v;},0);}

    var s=months.map(function(ym,i){

    var t=tot(arr),a=avgM.reduce(function(x,ym){return x+(arr[pos[ym]]||0);},0)/na;

  function sec(label){return '<tr class="sec"><td>'+label+'</td><td colspan="'+(nc+2)+'"></td></tr>';}
  function catRows(g,type){
    var sk=P.sort,pi=/^m:/.test(sk)?pos[sk.slice(2)]:null;
    if(/^m:/.test(sk)&&pi==null) sk='tot';
    var nmOf=function(k){var c=catById(k);return c?c.n:'Da categorizzare';};
    var keyOf=function(k){var a=g[k];return sk==='avg'?avgM.reduce(function(x,ym){return x+(a[pos[ym]]||0);},0):pi!=null?(a[pi]||0):tot(a);};
    var ks=Object.keys(g).filter(function(k){return tot(g[k])!==0;}).sort(function(a,b){
      if(sk==='name') return nmOf(a).localeCompare(nmOf(b),'it',{sensitivity:'base'});
      return keyOf(b)-keyOf(a)||tot(g[b])-tot(g[a])||nmOf(a).localeCompare(nmOf(b),'it',{sensitivity:'base'});
    });
    return ks.map(function(k){
      var c=catById(k),nm=c?c.n:'Da categorizzare',bud=type==='spesa'&&c&&c.b?c.b:0;

    }).join('');
  }
  var body='';
  if(tot(M.ent)||Object.keys(M.entrata).length) body+=sec('Entrate')+catRows(M.entrata,'entrata')+'<tr class="tot"><td>Totale entrate</td>'+cells(M.ent,{noheat:true})+'</tr>';
  body+=sec('Spese')+catRows(M.spesa,'spesa')+'<tr class="tot"><td>Totale spese</td>'+cells(M.usc,{noheat:true})+'</tr>';
  var dif=M.ent.map(function(v,i){return v-M.usc[i];});
  body+='<tr class="tot dif"><td>Differenza</td>'+months.map(function(ym,i){var v=dif[i];return v?'<td class="'+(v>0?'good':'bad')+'">'+(v>0?'+':'')+fmt0(v)+'</td>':'<td class="pmz">–</td>';}).join('')+
    '<td class="tc '+(tot(dif)>=0?'good':'bad')+'">'+(tot(dif)>0?'+':'')+fmt0(tot(dif))+'</td><td class="ta '+(aEnt-aUsc>=0?'good':'bad')+'">'+(aEnt-aUsc>0?'+':'')+fmt0(aEnt-aUsc)+'</td></tr>';
  if(tot(M.rsp)||tot(M.tit)) body+=sec('Risparmio / PAC')+catRows(M.risp,'risparmio')+(tot(M.tit)?'<tr><td title="Acquisti di titoli (ETF, azioni…) dal dossier: sono risparmio, non una spesa. In parte coincidono con il PAC che arriva sul conto di investimento, quindi non vanno sommati alle righe sopra."><span class="dot" style="background:#b86bff"></span> Titoli acquistati (dossier)</td>'+cells(M.tit,{noheat:true})+'</tr>':'');
  if(tot(M.gin)||tot(M.gout)) body+=sec('Giroconti · non inclusi nei totali')+'<tr><td>Arrivati da altri conti</td>'+cells(M.gin,{noheat:true})+'</tr><tr><td>Usciti verso altri conti</td>'+cells(M.gout,{noheat:true})+'</tr>';
  var bs=balanceSeries(P.acct==='all'?S.accounts:[acctById(P.acct)],S.tx,snapsOf,months,todayISO(),'titoli',effType,U.xl),bnote='';
  if(bs){
    var sgn=function(v){return (v>0?'+':'')+fmt0(v);},nz=function(arr){return arr.map(function(v){return v==null?0:v;});},
      vv=nz(bs.vari),mm=bs.tit.map(function(v,i){return v==null?0:v+bs.sv[i];}),bb=nz(bs.bnd),qq=nz(bs.esc),dd=bs.end.map(function(e,i){return e==null?0:e-bs.start[i];}),
      avgOf=function(arr){return avgM.reduce(function(x,ym){return x+(arr[pos[ym]]||0);},0)/na;},
      cls=function(v){return v>0?'good':v<0?'bad':'';},
      cc=function(ym){return (ym===thisYM?' cur':'')+(ym>thisYM?' fut':'');};
    var cellsB=function(arr,kind){
      return months.map(function(ym,i){
        var v=bs[kind==='s'?'start':'vari'][i]==null?null:arr[i];
        if(v==null||(kind==='m'&&!v)) return '<td class="pmz'+cc(ym)+'">–</td>';
        if(kind==='s') return '<td class="'+cc(ym).trim()+'">'+fmt0(v)+'</td>';
        if(kind==='m') return '<td class="muted'+cc(ym)+'">'+fmt0(v)+'</td>';
        return '<td class="'+cls(v)+cc(ym)+'">'+sgn(v)+'</td>';
      }).join('');
    };
    var from=mlabel(months[0]).replace(/ \d+$/,''),vTot=tot(vv),mTot=tot(mm);
    body+='<tr class="sec"><td class="wl">Stiamo risparmiando? · saldo dei conti</td><td colspan="'+(nc+2)+'"></td></tr>'+
      '<tr class="tot" title="Quanto c’è sui conti il primo giorno del mese"><td class="wl">Saldo a inizio mese</td>'+cellsB(bs.start,'s')+'<td class="tc pmz">–</td><td class="ta pmz">–</td></tr>'+
      '<tr title="Entrate − spese davvero incassate e pagate nel mese, senza giroconti con conti non inclusi né operazioni straordinarie (es. vendita casa). Se è negativo stai intaccando i risparmi."><td class="wl">Risparmiato nel mese</td>'+cellsB(vv,'v')+'<td class="tc '+cls(vTot)+'">'+sgn(vTot)+'</td><td class="ta '+cls(avgOf(vv))+'">'+sgn(avgOf(vv))+'</td></tr>'+
      '<tr class="tot" title="Somma di quanto risparmiato (o intaccato) mese dopo mese"><td class="wl">Progressivo da '+esc(from)+'</td>'+cellsB(bs.prog,'v')+'<td class="tc pmz">–</td><td class="ta pmz">–</td></tr>'+
      (mTot?'<tr title="Parte del risparmio che è finita in titoli, PAC o polizze: non è sul conto ma è comunque vostra"><td class="muted wl">di cui in titoli / PAC</td>'+cellsB(mm,'m')+'<td class="tc muted">'+fmt0(mTot)+'</td><td class="ta muted">'+fmt0(avgOf(mm))+'</td></tr>':'');
    var rowB=function(label,arr,strong,tip){
      var t=tot(arr);

        return v==null||(!v&&!strong)?'<td class="pmz'+cc(ym)+'">–</td>':'<td class="'+(strong?'':'muted')+cc(ym)+'">'+(strong&&!v?'0':sgn(v))+'</td>';
      }).join('')+'<td class="tc'+(strong?'':' muted')+'">'+(t||strong?sgn(t):'–')+'</td></tr>';
    };
    var hd='<tr><th class="wl">Da dove viene la variazione del saldo</th>'+months.map(function(ym){return '<th class="'+cc(ym).trim()+'"><span>'+mshort(ym)+'</span><small>'+ym.slice(2,4)+'</small></th>';}).join('')+'<th class="tc">Totale</th></tr>';
    var bridge='<details class="pmbr" data-tg="pmbr"'+(U.pmbr?' open':'')+'><summary>Perché il saldo sale (o scende) diversamente? Mostra il dettaglio</summary><div class="scroll"><table class="pm pmx"><thead>'+hd+'</thead><tbody>'+
      rowB('Risparmiato nel mese',vv,false)+

      rowB('più: arrivato da conti non inclusi',bb,false,'Giroconti da/verso conti che non sono in questo calcolo (es. un libretto): fanno cambiare il saldo ma non sono risparmio del mese')+
      rowB('più: operazioni straordinarie (es. casa)',qq,false,'Operazioni «escluse dai conti», come vendita o acquisto di una casa: fanno cambiare il saldo ma non sono entrate né spese')+
      rowB('= Variazione del saldo sui conti',dd,true,'Saldo a fine mese − saldo a inizio mese')+
      '</tbody></table></div></details>';
    bnote=bridge+'<p class="note"><b>Saldo dei conti.</b> Conti inclusi: '+bs.used.map(function(u){return esc(u.n);}).join(', ')+'.'+
      (bs.skipped.length?' Non inclusi: '+bs.skipped.map(function(u){return esc(u.n)+' ('+esc(u.why.replace(/(\d{4})-(\d{2})-(\d{2})/,'$3/$2/$1'))+')';}).join(', ')+' — per includerli imposta un loro saldo a una data precedente al primo mese mostrato.':'')+
      ' «Risparmiato» segue i soldi davvero entrati e usciti (data di pagamento), quindi con «per competenza» può differire dalla Differenza qui sopra. Il mese in corso arriva a oggi.</p>';
  }
  h+='<div class="card"><h2>Categorie per mese · '+(P.cash?'per data di pagamento':'per competenza')+'</h2><div class="scroll"><table class="pm"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+bnote+

  return h;
}

function deleteTx(ids,remember){
  var set=toSet(ids),now=Date.now(),n=0;
  S.tx=S.tx.filter(function(t){if(set[t.id]){S.del[t.id]=remember?now:-now;n++;return false;}return true;});
  save();return n;
}
// sposta i movimenti su un altro conto ricalcolando gli id (così un nuovo import dello stesso file non crea doppioni)
function moveTx(ids,dest,carry){
  var set=toSet(ids),now=Date.now(),byId={},res={moved:0,dup:0,map:{}},drop={};
  S.tx.forEach(function(t){byId[t.id]=t;});
  S.tx.forEach(function(t){
    if(!set[t.id]||t.a===dest) return;
    var oid=t.id,nid=moveId(t,dest),ex=byId[nid];
    if(nid!==oid&&ex&&ex!==t){
      if(!ex.c&&t.c){ex.c=t.c;stamp(ex);}
      if(!ex.al&&t.al){ex.al=t.al;stamp(ex);}
      if(!ex.n&&t.n){ex.n=t.n;stamp(ex);}
      drop[oid]=1;S.del[oid]=now;res.dup++;res.map[oid]=ex.id;return;
    }
    if(nid!==oid){S.del[oid]=now;delete S.del[nid];delete byId[oid];t.id=nid;byId[nid]=t;}
    t.a=dest;stamp(t);res.moved++;res.map[oid]=nid;
  });
  if(res.dup) S.tx=S.tx.filter(function(t){return !drop[t.id];});
  if(carry) carryAcct(carry.from,dest,carry.spec);
  save();return res;
}
// porta IBAN / n. conto / saldo di riferimento da un conto a un altro (spec = solo ciò che era stato letto da una certa importazione)
function carryAcct(srcId,destId,spec){
  var s=acctById(srcId),d=acctById(destId);if(!s||!d||s===d) return;
  if(s.iban&&(!spec||(spec.iban&&s.iban===spec.iban))){if(!d.iban) d.iban=s.iban;if(d.iban===s.iban) s.iban='';}
  if(s.num&&(!spec||(spec.num&&s.num===spec.num))){if(!d.num) d.num=s.num;if(d.num===s.num) s.num='';}
  var sa=s.anchor;
  if(sa&&(!spec||(spec.anchor&&sa.d===spec.anchor.d&&sa.m===spec.anchor.m))){
    if(!d.anchor||sa.d>d.anchor.d) d.anchor={d:sa.d,m:sa.m};
    s.anchor=(spec&&spec.prev)?spec.prev:null;
  }
  stamp(s);stamp(d);
}
function undoBatch(id){
  var b=S.imps.find(function(x){return x.id===id;});if(!b) return 0;
  var now=Date.now(),n=0;
  S.tx=S.tx.filter(function(t){if(t.b===id){S.del[t.id]=-now;n++;return false;}return true;});
  var acc=acctById(b.a);
  if(acc){
    if(b.liban&&acc.iban===b.liban){acc.iban='';stamp(acc);}
    if(b.lnum&&acc.num===b.lnum){acc.num='';stamp(acc);}
    if(b.na&&acc.anchor&&acc.anchor.d===b.na.d&&acc.anchor.m===b.na.m){acc.anchor=b.pa||null;stamp(acc);}
  }
  removeItem('imps',id);
  return n;
}

  var pct=function(x){return (x>=0?'+':'')+fmtNum(x,1,1)+'%';};

// righe del file → movimenti nuovi / già presenti (riconosciuti per id; se il file porta categorie o competenze anche per stesso giorno e importo)
function impUpdateMode(){var m=imp.map;return !!m&&(m.cat>=0||m.cy>=0||m.comp>=0);}
function impParse(){
  var r=parseRows(imp.rows,imp.hdr,imp.map,imp.invert);
  assignIds(r.items,imp.acct);
  var byId={},byDC={},used={},exist=[],fresh=[],blocked=0,mine=[];
  S.tx.forEach(function(t){
    byId[t.id]=t;
    if(t.a===imp.acct){mine.push(t);var k=t.d+'|'+t.m;(byDC[k]=byDC[k]||[]).push(t);}
  });
  r.items.forEach(function(i){
    var t=byId[i.id];
    if(t&&t.a===imp.acct&&!used[t.id]){used[t.id]=1;i._m=1;exist.push({it:i,tx:t});}
  });
  var upd=impUpdateMode();
  if(upd) r.items.forEach(function(i){
    if(i._m) return;
    var list=byDC[i.d+'|'+i.cents]||[];
    for(var j=0;j<list.length;j++) if(!used[list[j].id]){used[list[j].id]=1;i._m=1;exist.push({it:i,tx:list[j]});return;}
  });
  var lo=null,hi=null;
  if(upd&&imp.o.skipOld&&exist.length&&mine.length){
    mine.forEach(function(t){if(lo==null||t.d<lo) lo=t.d;if(hi==null||t.d>hi) hi=t.d;});
  }
  var old=0;
  r.items.forEach(function(i){
    if(i._m) return;
    if(S.del[i.id]>0){blocked++;return;}
    if(lo!=null&&i.d>=lo&&i.d<=hi){old++;return;}
    fresh.push(i);
  });
  return {items:r.items,fresh:fresh,dup:r.items.length-fresh.length-old,skipped:r.skipped,exist:exist,old:old,blocked:blocked,lo:lo,hi:hi};
}
function impLabels(items){
  var by={},order=[];
  items.forEach(function(i){
    if(!i.cl) return;
    var k=catKey(i.cl,i.cents),o=by[k];
    if(!o){o=by[k]={k:k,label:i.cl,neg:i.cents<0,n:0,sum:0};order.push(k);}
    o.n++;o.sum+=i.cents;
  });
  return order.map(function(k){return by[k];}).sort(function(a,b){return b.n-a.n;});
}

var CATHINT=[[/\bmutuo\b/,'mutuo'],[/^condomin/,'condo'],[/^spesa$|^spese$|supermerc|alimentar/,'spesa'],[/^tari\b|rifiuti/,'rifiuti'],[/^imu\b|^730\b|^tasse|^imposte/,'tasse'],[/^auto$|^auto e |carburant/,'auto'],[/^vacanz|^viagg/,'viaggi'],[/^stipend/,'stip']];
function autoMapCat(label,neg){
  var n=normDesc(label),ex=S.cats.find(function(c){return normDesc(c.n)===n;});
  if(ex) return ex.id;
  if(/^ALTR[OE]$|^ALTRE (USCITE|SPESE|ENTRATE)$|^(ENTRATE|USCITE|SPESE) VARIE$/.test(n)) return neg?(catById('altro')?'altro':'+'):(catById('entr')?'entr':'+');
  if(/\bGIROCONT/.test(n)){var gi=giroId();if(gi) return gi;}
  var low=String(label).toLowerCase();
  for(var i=0;i<CATHINT.length;i++) if(CATHINT[i][0].test(low)&&catById(CATHINT[i][1])) return CATHINT[i][1];
  return '+';
}

function impSummary(res){

function loadXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxP) return xlsxP;
  xlsxP=new Promise(function(res,rej){
    var sc=document.createElement('script');
    function fail(msg){try{sc.remove();}catch(e){}xlsxP=null;rej(new Error(msg));}
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.crossOrigin='anonymous';sc.referrerPolicy='no-referrer';
    sc.onload=function(){if(window.XLSX) res(); else fail('libreria XLSX non valida');};
    sc.onerror=function(){fail('libreria XLSX non raggiungibile (offline?): esporta in CSV');};
    document.head.appendChild(sc);
  });
  return xlsxP;
}

function importBfpWorkbook(wb){
  var items=null,skipped=0,rules=[];
  wb.SheetNames.forEach(function(n){
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
    if(!items){var r=parseBfpRows(rows);if(r){items=r.items;skipped=r.skipped;}}

  });
  if(!items) throw new Error('non trovo l’elenco dei buoni (servono le colonne Data sottoscrizione, Data scadenza, Importo versato, Importo lordo a scadenza)');
  var ex={};(S.bfp||[]).forEach(function(b){ex[b.id]=1;});
  var now=Date.now(),added=0;
  items.forEach(function(it){
    var id='b'+cyrb53([it.h,it.n,it.d0,it.d1,it.v,it.k].join('|')).toString(36);
    if(ex[id]) return;ex[id]=1;
    delete S.del[id];

  var rn=0;

    S.bfpH.push({id:'h'+cyrb53(r.n).toString(36),n:r.n,r:r.r,m:r.m,u:now});rn++;
  });
  save();render();
  return 'Buoni: '+added+' nuovi'+(items.length-added?' · '+(items.length-added)+' già presenti':'')+(skipped?' · '+skipped+' righe scartate':'')+(rn?' · '+rn+' regole di rimborso anticipato':'');

function interestFor(a){
  if(!a||!(a.rate>0)||!a.cred) return null;
  var T=todayISO(),base,hist;
  if(a.mode==='mov'){
    var bal=computeBalance(a,S.tx,T);
    if(bal==null) return null;
    var mine=S.tx.filter(function(t){return t.a===a.id&&t.d<=T;}),last=a.anchor.d;
    mine.forEach(function(t){if(t.d>last) last=t.d;});
    base={d:last,m:bal};
    hist=function(d){var b=bal;for(var i=0;i<mine.length;i++){var t=mine[i];if(t.d>d&&t.d<=last) b-=t.m;}return b;};
  }else{
    var sn=snapsOf(a.id);
    if(!sn.length) return null;
    var asc=sn.slice().reverse();
    base={d:sn[0].d,m:sn[0].m};
    hist=function(d){var v=asc[0].m;for(var i=0;i<asc.length;i++){if(asc[i].d<=d) v=asc[i].m;}return v;};
  }
  var p=projectInterest({rate:a.rate,wh:a.wh,cred:a.cred,base:base,hist:hist,T:T});
  if(p){p.baseD=base.d;p.baseM=base.m;}
  return p;
}

var PAT_G=[
  {g:'cc',n:'Conti correnti',col:'#4f8cff'},
  {g:'risp',n:'Risparmio remunerato',col:'#27ae7a'},
  {g:'inv',n:'Titoli e ETF',col:'#b86bff'},
  {g:'bfp',n:'Buoni postali',col:'#f2994a'},
  {g:'att',n:'Immobili e altri beni',col:'#2fb7c9'},
  {g:'pas',n:'Debiti',col:'#e5586e'}
];
var PAT_T=[['immobile','Immobile (casa, terreno…)','att'],['veicolo','Veicolo','att'],['attaltro','Altro bene','att'],['mutuo','Mutuo residuo','pas'],['finanz','Finanziamento residuo','pas'],['pasaltro','Altro debito','pas']];
function patTypeName(t){var x=PAT_T.find(function(p){return p[0]===t;});return x?x[1].replace(/ \(.*\)$/,''):'';}
// righe del patrimonio con la stessa logica di saldo della scheda Conti; i buoni postali entrano al netto dell'imposta stimata
function patRows(){
  var rows=[],miss=[],T=todayISO();
  S.accounts.forEach(function(a){
    var bal=null,ip=interestFor(a),asof=null;
    if(a.mode==='mov'){
      bal=computeBalance(a,S.tx,T);
      if(a.anchor){asof=a.anchor.d;S.tx.forEach(function(t){if(t.a===a.id&&t.d<=T&&t.d>asof) asof=t.d;});}
    }else{var l=snapsOf(a.id)[0];bal=l?l.m:null;asof=l?l.d:null;}
    if(ip) bal=ip.est;
    if(bal==null) miss.push(a);
    else rows.push({g:a.rate>0?'risp':'cc',id:a.id,n:a.n,bank:a.bank||'',m:bal,est:!!ip,asof:asof,old:!!(asof&&dayNum(T)-dayNum(asof)>14)});
    var dos=a.inv?dossierInfo(a.id):null;
    if(dos) rows.push({g:'inv',id:a.id,n:'Titoli · '+a.n,bank:a.bank||'',m:dos.value,cost:dos.cost,pl:dos.pl});
  });
  var ld=looseDossier();
  if(ld) rows.push({g:'inv',n:'Titoli · dossier senza conto',bank:'',m:ld.value,cost:ld.cost,pl:ld.pl});
  if(S.bfp&&S.bfp.length){
    var sm=bfpSummary(T);
    rows.push({g:'bfp',n:'Buoni fruttiferi postali',bank:'Poste Italiane',m:Math.round(sm.net),gross:Math.round(sm.val),tax:Math.round(sm.val)-Math.round(sm.net),early:Math.round(sm.earlyNet),cnt:sm.n});
  }
  (S.pat||[]).forEach(function(it){
    rows.push({g:it.k,id:it.id,n:it.n,bank:patTypeName(it.t),m:it.m,d:it.d,note:it.note||'',stale:patStale(it,T),man:true});
  });
  return {rows:rows,miss:miss};
}
// registra (o aggiorna) il punto di oggi nello storico; false se non c'è niente da cambiare
function patRecord(){
  var T=todayISO(),pr=patRows();
  if(!pr.rows.length) return false;
  var t=patTotals(pr.rows),id='p'+T,ex=(S.pats||[]).find(function(x){return x.id===id;});
  if(!ex&&S.del[id]) return false;
  var nv={t:t.net,cc:t.cc,risp:t.risp,inv:t.inv,bfp:t.bfp,att:t.att,pas:t.pas};
  if(ex&&Object.keys(nv).every(function(k){return ex[k]===nv[k];})) return false;
  var o=ex||{id:id,d:T};
  Object.assign(o,nv);stamp(o);
  if(!ex) S.pats.push(o);
  save();return true;
}

function lineChart(pts,half){
  var W=chartW(half?520:960,half),H=210,pb=26,pt=12,pr=12,fs=12;
  var lo=Infinity,hi=-Infinity;
  pts.forEach(function(p){if(p.t<lo) lo=p.t;if(p.t>hi) hi=p.t;});
  if(hi-lo<=0){var pd=Math.max(Math.abs(hi)*0.02,10000);lo-=pd;hi+=pd;}
  var step=niceStep((hi-lo)/4),top=Math.ceil(hi/step)*step,bot=Math.floor(lo/step)*step;
  if(top<=bot) top=bot+step;
  var ticks=[];
  for(var v=bot;v<=top+step/1000;v+=step) ticks.push([v,axisEur(v)]);
  var pl=Math.max(46,Math.round(Math.max.apply(null,ticks.map(function(t){return t[1].length;}))*fs*0.62)+12);
  var iw=W-pl-pr,ih=H-pt-pb,d0=dayNum(pts[0].d),d1=dayNum(pts[pts.length-1].d),span=Math.max(1,d1-d0),g='';
  function X(d){return pl+(pts.length>1?(dayNum(d)-d0)/span:0.5)*iw;}
  function Y(v){return pt+ih-(v-bot)/(top-bot)*ih;}
  ticks.forEach(function(t){
    g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(t[0])+'" y2="'+Y(t[0])+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(Y(t[0])+3)+'" text-anchor="end" font-size="'+fs+'" fill="var(--muted)">'+t[1]+'</text>';
  });
  var lb=function(d){return span>62?d.slice(5,7)+'/'+d.slice(2,4):d.slice(8)+'/'+d.slice(5,7);};
  var nl=Math.min(pts.length,5),prevLb='';
  for(var i=0;i<nl;i++){
    var p=pts[nl>1?Math.round(i*(pts.length-1)/(nl-1)):0],l=lb(p.d);
    if(l===prevLb&&i<nl-1) continue;
    prevLb=l;
    g+='<text x="'+X(p.d)+'" y="'+(H-8)+'" text-anchor="'+(i===0&&nl>1?'start':i===nl-1&&nl>1?'end':'middle')+'" font-size="'+fs+'" fill="var(--muted)">'+l+'</text>';
  }
  var line=pts.map(function(p,i){return (i?'L':'M')+X(p.d).toFixed(1)+','+Y(p.t).toFixed(1);}).join(' ');
  if(pts.length>1) g+='<path d="'+line+' L'+X(pts[pts.length-1].d).toFixed(1)+','+(pt+ih)+' L'+X(pts[0].d).toFixed(1)+','+(pt+ih)+' Z" fill="var(--accent)" opacity=".1"/>'+
    '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>';
  pts.forEach(function(p,i){
    var last=i===pts.length-1;
    g+='<circle cx="'+X(p.d).toFixed(1)+'" cy="'+Y(p.t).toFixed(1)+'" r="'+(last?4:pts.length>40?0:2.5)+'" fill="var(--accent)"><title>'+fd(p.d)+' · '+eur(p.t)+'</title></circle>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Andamento del patrimonio netto" style="width:100%;height:auto">'+g+'</svg>';
}

var BKKEY=KEY+'_bk',SNZKEY=KEY+'_bksnz',SINCEKEY=KEY+'_since';
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
// i dati stanno solo in questo browser: se lo si pulisce o si cambia dispositivo si perdono, quindi un promemoria ogni 30 giorni
function backupDue(){
  if(!S.tx.length&&!(S.pat||[]).length&&!(S.bfp||[]).length&&!(S.snaps||[]).length) return null;
  var now=Date.now(),last=+lsGet(BKKEY)||0,snz=+lsGet(SNZKEY)||0,since=+lsGet(SINCEKEY)||0;
  if(!since){since=now;lsSet(SINCEKEY,String(since));}
  if(snz>now) return null;
  if(last?now-last<30*864e5:now-since<2*864e5) return null;
  return {last:last,days:last?Math.floor((now-last)/864e5):null};
}
function lastBackupText(){var l=+lsGet(BKKEY)||0;return l?fd(isoOf(l)):'mai';}
function renderBanner(){
  var el=$('#banner');if(!el) return;
  var h='';
  var blocked=saveErr&&/Security|NotAllowed|insecure/i.test(String(saveErr.name||saveErr)+' '+String(saveErr.message||'')),quota=saveErr&&/Quota/i.test(String(saveErr.name||'')+' '+String(saveErr.message||''));
  if(saveErr||(bootNote&&bootNote.k==='noaccess')) h+='<div class="bn bad" role="alert"><b>Non riesco a salvare nel browser.</b> '+
    (quota?'Lo spazio che il browser dà a questa pagina è pieno. '+usageText()+'Scarica un backup e libera spazio (o elimina i dati di altri siti).':
     (blocked||!saveErr)?'Questa pagina è aperta dove il browser blocca la memoria (anteprima dentro un’app, pagina incorporata o navigazione privata). Scarica il file e aprilo in una scheda normale di Chrome, Safari o Edge: lì i dati restano.':
     'Errore del browser: '+esc(String(saveErr.name||'')+(saveErr.message?' · '+String(saveErr.message).slice(0,80):''))+'.')+
    ' Finché non chiudi la pagina i dati restano in memoria: <button class="btn sm" data-act="export">Scarica un backup ora</button></div>';
  if(ovf&&!saveErr) h+='<div class="bn" role="status"><b>La memoria normale del browser è piena o non disponibile per questa pagina.</b> '+(/Quota/i.test(String(ovf.name||'')+' '+String(ovf.message||''))?usageText():'')+'I dati sono al sicuro in un archivio di riserva del browser (IndexedDB), ma scarica un backup ogni tanto. <button class="btn sm" data-act="export">Scarica un backup ora</button></div>';
  if(bootNote){
    if(bootNote.k==='bad') h+='<div class="bn" role="alert"><b>I dati salvati non erano leggibili.</b> Ne ho conservato una copia nel browser: se hai un backup .json importalo da Impostazioni. <button class="btn sm" data-act="dl-bad">Scarica la copia illeggibile</button><button class="btn sm" data-act="bn-close">Chiudi</button></div>';
    else if(bootNote.k==='dropped') h+='<div class="bn" role="status">Al caricamento ho scartato '+nf(bootNote.n)+(bootNote.n===1?' elemento non valido':' elementi non validi')+' (ne resta una copia nel browser). <button class="btn sm" data-act="bn-close">Chiudi</button></div>';
  }
  var bd=(saveErr||bootNote||ovf)?null:backupDue();
  if(bd) h+='<div class="bn" role="status">'+(bd.last?'Hai scaricato l’ultimo backup '+nf(bd.days)+(bd.days===1?' giorno fa.':' giorni fa.'):'Non hai ancora scaricato un backup.')+' I dati stanno solo in questo browser: se lo pulisci o cambi dispositivo si perdono. <button class="btn sm" data-act="export">Scarica un backup</button><button class="btn sm" data-act="bk-later">Più tardi</button></div>';
  el.innerHTML=h;
}
// tabella «per mese»: frecce, Home/Fine; Invio o Spazio aprono i movimenti della cella
function pmNav(td,key){
  var tr=td.parentNode,tb=tr.parentNode,rows=Array.prototype.slice.call(tb.rows),ri=rows.indexOf(tr),ci=td.cellIndex,nx=null,i;
  function pick(row,c){var x=row&&row.cells[c];return x&&x.classList.contains('pmc')?x:null;}
  if(key==='ArrowLeft'||key==='ArrowRight'||key==='Home'||key==='End'){
    var cs=Array.prototype.slice.call(tr.cells).filter(function(x){return x.classList.contains('pmc');});
    var k=cs.indexOf(td);
    nx=key==='Home'?cs[0]:key==='End'?cs[cs.length-1]:cs[k+(key==='ArrowLeft'?-1:1)];
  }else{
    var step=key==='ArrowUp'?-1:1;
    for(i=ri+step;i>=0&&i<rows.length&&!nx;i+=step) nx=pick(rows[i],ci);
  }
  if(nx){td.tabIndex=-1;nx.tabIndex=0;nx.focus();}
}
document.addEventListener('keydown',function(e){
  var td=e.target&&e.target.closest&&e.target.closest('td.pmc');if(!td||e.altKey||e.ctrlKey||e.metaKey) return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();td.click();}
  else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].indexOf(e.key)>=0){e.preventDefault();pmNav(td,e.key);}
});

// un'altra scheda dell'app ha salvato: si uniscono i suoi dati ai miei (senza mai perderne), poi si ripubblica solo se qui c'era qualcosa in più
window.addEventListener('storage',function(e){
  if(e.key!==KEY||e.newValue==null||e.newValue===lastRaw) return;
  lastRaw=e.newValue;
  var res=absorbRaw(e.newValue);
  if(!res) return;
  if(res.added||res.updated||res.removed){render();toast('Dati aggiornati da un’altra scheda');}
  if(res.localAhead>0) save();
});
