function tierRank(t) {
  return TIER_ORDER.indexOf(t);
}
function buildCyclicOrder(players, role, startLetter) {
  const pool = players.map((p, idx) => ({
    ...p,
    _idx: idx
  })).filter(p => p.r === role && p.status === "available").sort((a, b) => a.n.localeCompare(b.n, "it"));
  if (!pool.length) return [];
  if (!startLetter) return pool;
  const L = startLetter.toUpperCase();
  let startPos = pool.findIndex(p => p.n.toUpperCase().charAt(0) >= L);
  if (startPos === -1) startPos = 0;
  return [...pool.slice(startPos), ...pool.slice(0, startPos)];
}
function emptyRoster() {
  return {
    P: [],
    D: [],
    C: [],
    A: []
  };
}
function defaultTeams() {
  const nomi = ["AYUTO NAGATOMO", "MARUCCIO", "BINNU/BAFFO", "STOMACI", "POKERIADE", "CEZZUIA", "MARSELLA/STICCHI", "FALCO"];
  return Array.from({
    length: 8
  }, (_, i) => ({
    id: i,
    name: nomi[i] || `Squadra ${i + 1}`,
    budget: 800,
    spent: 0,
    roster: emptyRoster()
  }));
}
function slotsUsed(roster) {
  return ROLE_SEQUENCE.reduce((a, r) => a + roster[r].length, 0);
}

// Il prezzo base d'asta e' 1cr, non la quotazione: per qualsiasi squadra, il rilancio massimo
// possibile ORA e' il budget residuo meno almeno 1cr riservato per ciascuno degli ALTRI slot
// ancora da riempire (25 totali, non solo per ruolo). Vale per tutte le 8 squadre, non solo la tua.
function maxBidFor(team) {
  const slotsLeft = TOTAL_SLOTS - slotsUsed(team.roster);
  const budgetLeft = team.budget - team.spent;
  if (slotsLeft <= 0) return 0;
  return Math.max(0, budgetLeft - Math.max(0, slotsLeft - 1));
}

// ===================== AUCTION ENGINE =====================
// Calcolo puramente matematico e deterministico. Nessuna AI decide i prezzi:
// l'AI (vedi getAuctionAdvice piu' sotto) potra' solo INTERPRETARE questi numeri.
//
// Catena: marketPrice -> scarsita' -> pressione avversari -> costo-opportunita' -> cap/floor
//         -> situationalMax -> decisione (AGGREDISCI / RILANCIA / VALUTA / MOLLA)

// Quanto puo' realmente spendere un avversario per QUESTO giocatore: non il budget nudo,
// ma il budget al netto di 1cr per ogni altro slot che deve ancora riempire.
function capacitaRealeAvversario(team, ruolo) {
  if (team.roster[ruolo].length >= ROLE_SLOTS[ruolo]) return 0; // non gli serve questo ruolo
  return maxBidFor(team);
}

// COSTO-OPPORTUNITA': confronta il giocatore con le migliori alternative ancora libere
// nello stesso ruolo e fascia comparabile. Tante alternative valide a prezzo simile =
// meno senso spingersi oltre; nessuna alternativa = ha senso pagare di piu'.
function costoOpportunita(player, allPlayers) {
  const alternative = allPlayers.filter(p => p.r === player.r && p.n !== player.n && p.status !== "assigned").filter(p => p.t === "Top" || p.t === "Ottimo").sort((a, b) => b.mp - a.mp).slice(0, 5);
  // Sostituti veri: costano al massimo il 110% di questo giocatore
  const sostituti = alternative.filter(p => p.mp <= player.mp * 1.10);
  return {
    nAlternative: sostituti.length,
    alternative: alternative.slice(0, 3)
  };
}
function situationalMax(player, myTeam, allTeams, allPlayers) {
  const hardCap = maxBidFor(myTeam); // vincolo invalicabile
  const base = player.mp || player.pi; // prezzo di mercato
  const maxNormal = Math.round(base * ENGINE.margineNormale);
  if (hardCap <= 0) {
    return {
      max: 0,
      maxNormal,
      molla: 1,
      base,
      breakdown: [],
      fattori: {}
    };
  }
  const breakdown = []; // ogni voce: { label, cr, detail } — spiegabile a occhio
  const clamp = (v, lim) => Math.max(-lim, Math.min(lim, v));

  // --- A. SCARSITA' (in crediti) -------------------------------------------------
  const roleAvailable = allPlayers.filter(p => p.r === player.r && p.status !== "assigned");
  const topOttimoLeft = roleAvailable.filter(p => p.t === "Top" || p.t === "Ottimo").length;
  let adjScarsita = 0;
  if (player.t === "Top" || player.t === "Ottimo") {
    // pieno bonus con 1 solo rimasto, zero da 6 in su
    const s = Math.max(0, Math.min(1, (6 - topOttimoLeft) / 5));
    adjScarsita = Math.round(clamp(base * ENGINE.scarsita.maxBonus * s, ENGINE.scarsita.capCr));
  }
  if (adjScarsita !== 0) breakdown.push({
    label: "Scarsita'",
    cr: adjScarsita,
    detail: `${topOttimoLeft} Top/Ottimo liberi in ${player.r}`
  });

  // --- B. RIVALI (capacita' reale, bisogno del ruolo, capitale gia' bruciato) -----
  const rivali = allTeams.filter(t => t.id !== myTeam.id);
  const rivaliInGara = rivali.filter(t => t.roster[player.r].length < ROLE_SLOTS[player.r]);
  const spendibili = rivaliInGara.map(t => maxBidFor(t));
  const rivaliCompetitivi = spendibili.filter(c => c >= base).length;
  const quotaCapitale = rivali.length ? rivali.reduce((a, t) => a + (t.budget - t.spent), 0) / rivali.reduce((a, t) => a + t.budget, 0) : 1; // 1 = nessuno ha ancora speso, 0 = tutti a secco
  // piu' rivali competitivi e piu' capitale ancora in giro -> pressione; se sono a secco -> sconto
  const spintaRivali = Math.min(1, rivaliCompetitivi / 4) * 0.65 + quotaCapitale * 0.35;
  let adjRivali;
  if (spintaRivali >= 0.5) {
    adjRivali = Math.round(clamp(base * ENGINE.rivali.maxBonus * ((spintaRivali - 0.5) / 0.5), ENGINE.rivali.capCr));
  } else {
    adjRivali = -Math.round(clamp(base * ENGINE.rivali.maxMalus * ((0.5 - spintaRivali) / 0.5), ENGINE.rivali.capCr));
  }
  if (adjRivali !== 0) breakdown.push({
    label: "Rivali",
    cr: adjRivali,
    detail: `${rivaliCompetitivi} possono competere · ${Math.round(quotaCapitale * 100)}% capitale ancora in gioco`
  });

  // --- C. COSTO-OPPORTUNITA' (il freno principale) --------------------------------
  const opp = costoOpportunita(player, allPlayers);
  let adjAlternative;
  if (opp.nAlternative === 0) {
    adjAlternative = Math.round(clamp(base * ENGINE.alternative.maxBonus, ENGINE.alternative.capCr));
  } else {
    const saturazione = Math.min(1, opp.nAlternative / 4);
    adjAlternative = -Math.round(clamp(base * ENGINE.alternative.maxMalus * saturazione, ENGINE.alternative.capCr));
  }
  breakdown.push({
    label: "Alternative",
    cr: adjAlternative,
    detail: opp.nAlternative === 0 ? "nessun sostituto comparabile" : `${opp.nAlternative} sostituti a prezzo simile`
  });

  // --- D. NECESSITA' DELLA MIA ROSA ----------------------------------------------
  const slotRuoloLiberi = ROLE_SLOTS[player.r] - myTeam.roster[player.r].length;
  const hoGiaTopNelRuolo = allPlayers.some(p => p.owner === myTeam.id && p.r === player.r && (p.t === "Top" || p.t === "Ottimo"));
  let adjNecessita = 0;
  if (slotRuoloLiberi <= 0) {
    adjNecessita = -Math.round(clamp(base * ENGINE.necessita.maxMalus, ENGINE.necessita.capCr));
  } else if (hoGiaTopNelRuolo) {
    adjNecessita = -Math.round(clamp(base * ENGINE.necessita.maxMalus * 0.6, ENGINE.necessita.capCr));
  } else if ((player.t === "Top" || player.t === "Ottimo") && slotRuoloLiberi > 0) {
    // mi serve ancora un giocatore di peso in questo ruolo
    const urgenza = Math.min(1, slotRuoloLiberi / ROLE_SLOTS[player.r] + 0.3);
    adjNecessita = Math.round(clamp(base * ENGINE.necessita.maxBonus * urgenza, ENGINE.necessita.capCr));
  }
  if (adjNecessita !== 0) breakdown.push({
    label: "La tua rosa",
    cr: adjNecessita,
    detail: slotRuoloLiberi <= 0 ? `ruolo ${player.r} gia' completo` : hoGiaTopNelRuolo ? `hai gia' un Top/Ottimo in ${player.r}` : `ti mancano ${slotRuoloLiberi} slot in ${player.r}`
  });

  // --- SOMMA + CAP/FLOOR ----------------------------------------------------------
  const somma = maxNormal + adjScarsita + adjRivali + adjAlternative + adjNecessita;
  const capTot = Math.round(base * ENGINE.capTotale);
  const floorTot = Math.round(base * ENGINE.floorTotale);
  let situational = Math.max(floorTot, Math.min(capTot, somma));
  const limitatoDalCap = somma > capTot;
  const finalMax = Math.min(hardCap, situational);
  const limitatoDalBudget = hardCap < situational;
  return {
    max: finalMax,
    maxNormal,
    molla: finalMax + 1,
    base,
    breakdown,
    fattori: {
      topOttimoLeft,
      rivaliCompetitivi,
      nAlternative: opp.nAlternative,
      alternative: opp.alternative,
      limitatoDalCap,
      limitatoDalBudget,
      totaleAggiustamenti: adjScarsita + adjRivali + adjAlternative + adjNecessita
    }
  };
}

// DECISIONE a 4 livelli, in funzione del prezzo attuale sul tavolo rispetto ai riferimenti.
function decisioneAsta(player, prezzoAttuale, sitMax) {
  const base = sitMax.base;
  const target = player.tp;
  const max = sitMax.max;
  if (max <= 0) return {
    label: "MOLLA",
    color: COLORS.red,
    hint: "Non hai slot o budget per questo giocatore"
  };
  if (player.t === "Da evitare") return {
    label: "MOLLA",
    color: COLORS.red,
    hint: "Fascia da evitare: non vale il rischio"
  };
  if (prezzoAttuale > max) return {
    label: "MOLLA",
    color: COLORS.red,
    hint: `Sopra il tuo massimo situazionale (${max}cr)`
  };
  if (prezzoAttuale <= base * 0.85) return {
    label: "AGGREDISCI",
    color: "#2ECC71",
    hint: "Sotto il valore di mercato: occasione"
  };
  if (prezzoAttuale <= target) return {
    label: "RILANCIA",
    color: COLORS.green,
    hint: "Ancora dentro il prezzo di trattativa"
  };
  return {
    label: "VALUTA",
    color: COLORS.gold,
    hint: `Sopra il target (${target}cr) ma sotto il massimo (${max}cr)`
  };
}

// ===================== INTERFACCIA PER L'AI (non ancora collegata) =====================
// Il motore calcola i numeri; l'AI potra' solo spiegarli. maxPrice arriva gia' deciso
